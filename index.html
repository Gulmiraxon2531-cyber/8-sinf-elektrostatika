m\",\"40 sm\",\"15 sm\"],0]\n];\nlet ti=0,ts=0,done=false;\nfunction tq(){\n  done=false;\n  if(ti>=20){\n    $(\"pb\").style.width=\"100%\";$(\"tn\").textContent=\"\";\n    $(\"tq\").textContent=`Natija: ${ts} / 20 (${ts*5}%)`;\n    $(\"to\").innerHTML=`<p>${ts>=18?\"🏆 Mukammal!\":ts>=14?\"👍 Juda yaxshi!\":ts>=10?\"🙂 Yaxshi, yana mashq qiling.\":\"📚 Masalalarni qayta yechib koʻring.\"}<\/p>`;\n    $(\"tx\").style.display=\"\";$(\"tx\").textContent=\"Qayta boshlash\";\n    return;\n  }\n  const q=T[ti];\n  $(\"tx\").style.display=\"none\";\n  $(\"pb\").style.width=(ti/20*100)+\"%\";\n  $(\"tn\").textContent=`Masala ${ti+1} / 20 · Toʻgʻri: ${ts}`;\n  $(\"tq\").textContent=q[0];\n  $(\"to\").innerHTML=\"\";\n  q[1].forEach((o,i)=>{\n    const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=o;\n    b.onclick=()=>{\n      if(done)return;done=true;\n      [...$(\"to\").children][q[2]].classList.add(\"right\");\n      if(i===q[2])ts++;else b.classList.add(\"bad\");\n      $(\"tx\").style.display=\"\";$(\"tx\").textContent=ti===19?\"Natijani koʻrish\":\"Keyingisi\";\n    };\n    $(\"to\").appendChild(b);\n  });\n}\n$(\"tx\").onclick=()=>{\n  if(ti>=20){ti=0;ts=0}else{ti++}\n  tq();\n};\n\n/* ---------- Ishga tushirish ---------- */\nshow(0);\ndrawSim1();\ndrawSim2();\ntq();\n"}, {"title": "Elektr maydon", "emoji": "🌐", "css": "\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fb;--card:#fff;--tx:#1c2333;--mu:#5b6578;--ac:#3b6cf6;--pos:#e5484d;--neg:#2f7de1;--ok:#17a673;--bd:#dde3ef}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;--bg:#0f1420;--card:#18202f;--tx:#e8ecf5;--mu:#9aa5bb;--ac:#6b93ff;--bd:#2a3550}}\n:root[data-theme=\"dark\"]{color-scheme:dark;--bg:#0f1420;--card:#18202f;--tx:#e8ecf5;--mu:#9aa5bb;--ac:#6b93ff;--bd:#2a3550}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader{padding:18px 16px 8px;max-width:760px;margin:auto}\nh1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--mu);font-size:14px}\nnav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:760px;margin:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}\nnav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:20px;font-size:14px;cursor:pointer}\nnav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}\nmain{max-width:760px;margin:auto;padding:8px 16px 40px}\nsection{display:none}section.on{display:block}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:10px 0}\nh2{font-size:19px;margin:6px 0}h3{font-size:16px;margin:0 0 6px}\n.card p{margin:6px 0}.f{font-weight:700;background:var(--bg);padding:8px 12px;border-radius:10px;display:inline-block}\ncanvas{width:100%;max-width:100%;border-radius:12px;background:var(--bg);border:1px solid var(--bd);touch-action:none;display:block;margin:8px 0;user-select:none}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}\n.btn{border:0;background:var(--ac);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;cursor:pointer}\n.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}\nselect{font-size:15px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}\ninput[type=range]{width:100%}\nlabel{display:block;font-size:14px;color:var(--mu)}\n.out{font-weight:600}.mu{color:var(--mu);font-size:14px}\n.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}\n.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:var(--pos);color:#fff;border-color:var(--pos)}\n.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0}\n", "body": "\n<header><h1>🌐 Elektr maydon<\/h1><p>Maydon kuchlanganligi, maydon chiziqlari, simulyatsiya, oʻyin va test<\/p><\/header>\n<nav id=\"nav\"><\/nav>\n<main>\n\n<section id=\"s0\" class=\"on\">\n<div class=\"card\"><h3>1. Elektr maydon<\/h3>\n<p>Zaryad atrofida elektr maydon mavjud boʻladi. Bu maydon boshqa zaryadga taʼsir kuchi bilan namoyon boʻladi. Maydon materiyaning bir turi boʻlib, zaryadlar oʻrtasidagi taʼsirni uzatadi.<\/p><\/div>\n<div class=\"card\"><h3>2. Maydon kuchlanganligi<\/h3>\n<p>Maydonning biror nuqtasidagi kuchlanganlik — shu nuqtaga qoʻyilgan <b>musbat sinov zaryadiga<\/b> taʼsir qiladigan kuchning shu zaryadga nisbati:<\/p>\n<p><span class=\"f\">E = F / q<\/span> &nbsp; (birligi: N/C)<\/p>\n<p>Kuch zaryadga bogʻliq: <span class=\"f\">F = q · E<\/span><\/p><\/div>\n<div class=\"card\"><h3>3. Nuqtaviy zaryad maydoni<\/h3>\n<p>Vakuumda q zaryaddan r masofadagi nuqtada:<\/p>\n<p><span class=\"f\">E = k · |q| / r²<\/span>, &nbsp; k = 9·10⁹ N·m²/C²<\/p>\n<p>Maydon yoʻnalishi: <b>musbat<\/b> zaryaddan chiqadi, <b>manfiy<\/b> zaryadga kiradi.<\/p><\/div>\n<div class=\"card\"><h3>4. Maydon chiziqlari<\/h3>\n<p>Maydon chiziqlari musbat zaryaddan boshlanib, manfiy zaryadda tugaydi. Chiziqlar <b>kesishmaydi<\/b>. Chiziqlarning zichligi maydon kuchlanganligini bildiradi: zich joy — kuchli maydon.<\/p><\/div>\n<div class=\"card\"><h3>5. Superpozitsiya<\/h3>\n<p>Bir nechta zaryad hosil qilgan maydon, har bir zaryad maydonlarining <b>vektor yigʻindisiga<\/b> teng: <span class=\"f\">E⃗ = E⃗₁ + E⃗₂ + …<\/span><\/p><\/div>\n<div class=\"card\"><h3>6. Bir jinsli maydon<\/h3>\n<p>Tekis kondensator plastinalari orasida maydon bir jinsli (hamma nuqtada bir xil): <span class=\"f\">E = U / d<\/span><\/p>\n<p>Zaryadlangan oʻtkazgich ichida elektrostatik maydon <b>nolga teng<\/b>.<\/p><\/div>\n<\/section>\n\n<section id=\"s1\">\n<h2>🧪 1-simulyatsiya: Tekis kondensator<\/h2>\n<p class=\"mu\">Plastinkalar orasidagi kuchlanish va masofani oʻzgartiring. Zaryadlangan zarra maydonda tezlanish bilan harakatlanadi. Zarra zaryadining ishorasini tanlang va “Boshlash”ni bosing.<\/p>\n<div class=\"row\">\n<select id=\"psign\"><option value=\"1\">Musbat zarra (+)<\/option><option value=\"-1\">Manfiy zarra (−)<\/option><\/select>\n<button class=\"btn\" id=\"pgo\">Boshlash<\/button>\n<button class=\"btn g\" id=\"prs\">Qayta<\/button>\n<\/div>\n<label>Plastinkalar orasidagi masofa d = <span id=\"pdv\"><\/span> sm<\/label><input type=\"range\" id=\"pd\" min=\"2\" max=\"10\" step=\"1\" value=\"6\">\n<label>Kuchlanish U = <span id=\"puv\"><\/span> V<\/label><input type=\"range\" id=\"pu\" min=\"0\" max=\"100\" step=\"1\" value=\"50\">\n<canvas id=\"c1\" width=\"360\" height=\"280\"><\/canvas>\n<div class=\"out\" id=\"i1\"><\/div>\n<\/section>\n\n<section id=\"s2\">\n<h2>🧪 2-simulyatsiya: Maydon chiziqlari<\/h2>\n<p class=\"mu\">Chapda musbat zaryad q₁ (oʻzgarmas). Oʻngdagi zaryad q₂ ni sliderda oʻzgartiring: manfiy qiymat — manfiy zaryad, musbat — musbat zaryad. Chiziqlar musbat zaryaddan chiqadi, manfiy zaryadga kiradi.<\/p>\n<label>q₁ = <span id=\"mq1v\"><\/span> (birlik)<\/label><input type=\"range\" id=\"mq1\" min=\"1\" max=\"10\" step=\"1\" value=\"4\">\n<label>q₂ = <span id=\"mq2v\"><\/span> (birlik, 0 — zaryad yoʻq)<\/label><input type=\"range\" id=\"mq2\" min=\"-10\" max=\"10\" step=\"1\" value=\"-4\">\n<canvas id=\"c2\" width=\"360\" height=\"300\"><\/canvas>\n<div class=\"out\" id=\"i2\"><\/div>\n<\/section>\n\n<section id=\"s3\">\n<h2>🎮 1-oʻyin: Zaryadni boshqaring<\/h2>\n<p class=\"mu\">Musbat zarra maydon taʼsirida harakatlanadi. Ekranni bosib ushlab tursangiz, maydon yuqoriga yoʻnalgan boʻladi va zarra koʻtariladi. Qoʻyib yuborsangiz, maydon pastga yoʻnalib, zarra tushadi. Devorlardagi tirqishlardan oʻting. 3 ta hayot bor.<\/p>\n<div class=\"row\"><span class=\"out\" id=\"g1i\">Boshlash uchun ekranni bosing<\/span><\/div>\n<canvas id=\"c3\" width=\"360\" height=\"300\"><\/canvas>\n<\/section>\n\n<section id=\"s4\">\n<h2>🎮 2-oʻyin: Maydon kuchlanganligini hisoblang<\/h2>\n<p class=\"mu\">Maydon kuchlanganligini E = F/q yoki E = k·q/r² formulasi bilan toping. Jami 10 savol.<\/p>\n<div class=\"card\">\n<p class=\"out\" id=\"g2q\"><\/p>\n<div id=\"g2o\"><\/div>\n<p class=\"out\" id=\"g2m\"><\/p>\n<\/div>\n<\/section>\n\n<section id=\"s5\">\n<h2>📝 Test (20 ta savol)<\/h2>\n<div class=\"card\"><div class=\"bar\"><i id=\"pb\"><\/i><\/div><p class=\"mu\" id=\"tn\"><\/p><h3 id=\"tq\"><\/h3><div id=\"to\"><\/div><div class=\"row\"><button class=\"btn\" id=\"tx\" style=\"display:none\">Keyingisi<\/button><\/div><\/div>\n<\/section>\n<\/main>\n\n", "js": "\nconst $=id=>document.getElementById(id);\nconst K=9e9;\nconst col=()=>getComputedStyle(document.body).color;\nconst SUP={\"-\":\"⁻\",\"0\":\"⁰\",\"1\":\"¹\",\"2\":\"²\",\"3\":\"³\",\"4\":\"⁴\",\"5\":\"⁵\",\"6\":\"⁶\",\"7\":\"⁷\",\"8\":\"⁸\",\"9\":\"⁹\"};\nconst sup=n=>String(n).split(\"\").map(c=>SUP[c]).join(\"\");\nconst num=(x,d)=>x.toFixed(d).replace(\".\",\",\");\nfunction fmtE(x){\n  const a=Math.abs(x);\n  if(a===0)return \"0\";\n  const e=Math.floor(Math.log10(a));\n  return num(x/10**e,2)+\"·10\"+(e<0?\"⁻\":\"\")+sup(Math.abs(e));\n}\nfunction fmtF(F){\n  const a=Math.abs(F);\n  if(a===0)return \"0 N\";\n  if(a>=0.01)return num(a,3)+\" N\";\n  return fmtE(F)+\" N\";\n}\nconst rnd=(a,b)=>a+Math.random()*(b-a);\n\n/* ---------- Navigatsiya ---------- */\nconst tabs=[\"📖 Nazariya\",\"🧪 Kondensator\",\"🧪 Maydon chiziqlari\",\"🎮 Zaryadni boshqaring\",\"🎮 Hisoblash\",\"📝 Test\"];\nfunction show(n){\n  document.querySelectorAll(\"section\").forEach((s,i)=>s.classList.toggle(\"on\",i===n));\n  [...$(\"nav\").children].forEach((b,i)=>b.classList.toggle(\"on\",i===n));\n}\ntabs.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;b.onclick=()=>show(i);$(\"nav\").appendChild(b)});\n\n/* ---------- 1-simulyatsiya: tekis kondensator ---------- */\nconst c1=$(\"c1\"),x1=c1.getContext(\"2d\");\nconst S1={y:140,v:0,run:false,stopped:\"\"};\nfunction geom1(){\n  const d=+$(\"pd\").value,U=+$(\"pu\").value;\n  const sep=d*15;\n  return{d,U,sep,top:140-sep/2,bot:140+sep/2,E:U/(d/100)};\n}\nfunction drawSim1(){\n  const g=geom1();\n  $(\"pdv\").textContent=g.d;$(\"puv\").textContent=g.U;\n  const q=+$(\"psign\").value;\n  x1.clearRect(0,0,360,280);\n  const c=col();\n  x1.fillStyle=\"#e5484d\";x1.fillRect(60,g.top-4,240,6);\n  x1.fillStyle=\"#2f7de1\";x1.fillRect(60,g.bot-2,240,6);\n  x1.fillStyle=c;x1.font=\"bold 14px system-ui\";x1.textAlign=\"left\";\n  x1.fillText(\"+\",306,g.top+3);x1.fillText(\"−\",306,g.bot+3);\n  // maydon chiziqlari (yuqoridan pastga)\n  x1.strokeStyle=c;x1.lineWidth=1.3;x1.globalAlpha=0.45;\n  for(let x=90;x<=270;x+=30){\n    x1.beginPath();x1.moveTo(x,g.top+3);x1.lineTo(x,g.bot-4);x1.stroke();\n    x1.beginPath();x1.moveTo(x-4,g.bot-10);x1.lineTo(x,g.bot-4);x1.lineTo(x+4,g.bot-10);x1.stroke();\n  }\n  x1.globalAlpha=1;\n  // zarra\n  x1.fillStyle=q>0?\"#e5484d\":\"#2f7de1\";\n  x1.beginPath();x1.arc(180,S1.y,11,0,7);x1.fill();\n  x1.fillStyle=\"#fff\";x1.font=\"bold 16px system-ui\";x1.textAlign=\"center\";\n  x1.fillText(q>0?\"+\":\"−\",180,S1.y+6);\n  const F=Math.abs(1e-6*g.E*(q>0?1:1));\n  let st=S1.stopped?` <b>${S1.stopped}<\/b>`:\"\";\n  $(\"i1\").innerHTML=`E = U/d = ${g.U} / ${num(g.d/100,2)} m = <b>${num(g.E,0)} V/m<\/b><br>\n    Zarraga taʼsir kuchi (q = 1 μC): F = qE = <b>${fmtF(1e-6*g.E)}<\/b>, ${q>0?\"maydon yoʻnalishida (pastga)\":\"maydonga qarshi (yuqoriga)\"}${st}`;\n}\nfunction stepS1(){\n  if(!S1.run)return;\n  const g=geom1();\n  const q=+$(\"psign\").value;\n  // a (px/kadr²) — E ga proporsional; musbat zarra maydon yoʻnalishida (pastga, +y)\n  S1.v+=q*g.E*0.0002;\n  S1.v*=0.98;\n  S1.y+=S1.v;\n  if(S1.y>=g.bot-14){S1.y=g.bot-14;S1.run=false;S1.stopped=q>0?\"Zarra pastki plastinkaga tegdi.\":\"\";}\n  if(S1.y<=g.top+14){S1.y=g.top+14;S1.run=false;S1.stopped=q<0?\"Zarra yuqori plastinkaga tegdi.\":\"\";}\n  drawSim1();\n  if(S1.run)requestAnimationFrame(stepS1);\n}\n$(\"pgo\").onclick=()=>{\n  if(S1.run)return;\n  S1.stopped=\"\";\n  S1.run=true;\n  requestAnimationFrame(stepS1);\n};\n$(\"prs\").onclick=()=>{S1.run=false;S1.y=140;S1.v=0;S1.stopped=\"\";drawSim1()};\n[\"pd\",\"pu\"].forEach(i=>$(i).oninput=()=>{drawSim1()});\n$(\"psign\").onchange=()=>{S1.run=false;S1.y=140;S1.v=0;S1.stopped=\"\";drawSim1()};\n\n/* ---------- 2-simulyatsiya: maydon chiziqlari ---------- */\nconst c2=$(\"c2\"),x2=c2.getContext(\"2d\");\nconst CH=[{x:110,y:150},{x:250,y:150}];\nfunction fieldAt(px,py,qs){\n  let ex=0,ey=0;\n  for(let i=0;i<2;i++){\n    const dx=px-CH[i].x,dy=py-CH[i].y,r2=dx*dx+dy*dy;\n    if(r2<1)continue;\n    const r=Math.sqrt(r2);\n    const k=qs[i]/(r2*r);\n    ex+=k*dx;ey+=k*dy;\n  }\n  return[ex,ey];\n}\nfunction traceLine(sx,sy,dir,qs){\n  let x=sx,y=sy;\n  x2.beginPath();x2.moveTo(x,y);\n  for(let s=0;s<900;s++){\n    const[ex,ey]=fieldAt(x,y,qs);\n    const m=Math.hypot(ex,ey);\n    if(m===0)break;\n    x+=dir*ex/m*2;y+=dir*ey/m*2;\n    if(x<0||x>360||y<0||y>300)break;\n    let hit=false;\n    for(const c of CH){if(Math.hypot(x-c.x,y-c.y)<9){hit=true;break}}\n    x2.lineTo(x,y);\n    if(hit)break;\n  }\n  x2.stroke();\n}\nfunction drawSim2(){\n  const q1=+$(\"mq1\").value,q2=+$(\"mq2\").value;\n  $(\"mq1v\").textContent=q1;$(\"mq2v\").textContent=q2;\n  const qs=[q1,q2];\n  x2.clearRect(0,0,360,300);\n  const c=col();\n  x2.strokeStyle=c;x2.lineWidth=1.3;x2.globalAlpha=0.55;\n  qs.forEach((q,i)=>{\n    if(q===0)return;\n    const n=6+2*Math.abs(q);\n    for(let j=0;j<n;j++){\n      const a=2*Math.PI*j/n;\n      const sx=CH[i].x+10*Math.cos(a),sy=CH[i].y+10*Math.sin(a);\n      traceLine(sx,sy,q>0?1:-1,qs);\n    }\n  });\n  x2.globalAlpha=1;\n  CH.forEach((c0,i)=>{\n    const q=qs[i];\n    x2.fillStyle=q>0?\"#e5484d\":q<0?\"#2f7de1\":\"#8a94a8\";\n    x2.beginPath();x2.arc(c0.x,c0.y,11,0,7);x2.fill();\n    x2.fillStyle=\"#fff\";x2.font=\"bold 16px system-ui\";x2.textAlign=\"center\";\n    x2.fillText(q>0?\"+\":q<0?\"−\":\"0\",c0.x,c0.y+6);\n  });\n  $(\"i2\").innerHTML=`Chiziqlar soni zaryadga proporsional. Musbat zaryaddan chiqadi, manfiy zaryadga kiradi.<br>\n    <span class=\"mu\">q₁ = ${q1}, q₂ = ${q2}. ${q1*q2<0?\"Zaryadlar turli ishorali: chiziqlar bir-biriga yoʻnaladi.\":q2===0?\"Ikkinchi zaryad yoʻq: chiziqlar cheksizlikka ketadi.\":\"Bir xil ishorali: chiziqlar bir-biridan itariladi.\"}<\/span>`;\n}\n[\"mq1\",\"mq2\"].forEach(i=>$(i).oninput=drawSim2);\n\n/* ---------- 1-oʻyin: zaryadni boshqaring ---------- */\nconst c3=$(\"c3\"),x3=c3.getContext(\"2d\");\nconst BX=80;\nlet G1={run:false,holding:false,ball:{y:150,v:0},walls:[],frame:0,score:0,lives:3,over:false};\nfunction resetG1(){\n  G1={run:false,holding:false,ball:{y:150,v:0},walls:[],frame:0,score:0,lives:3,over:false};\n  drawG1();\n}\nfunction drawG1(){\n  x3.clearRect(0,0,360,300);\n  const c=col();\n  G1.walls.forEach(w=>{\n    x3.fillStyle=\"#8a94a8\";\n    x3.fillRect(w.x,0,18,w.gy-40);\n    x3.fillRect(w.x,w.gy+40,18,300-(w.gy+40));\n  });\n  x3.fillStyle=\"#e5484d\";\n  x3.beginPath();x3.arc(BX,G1.ball.y,8,0,7);x3.fill();\n  x3.fillStyle=\"#fff\";x3.font=\"bold 12px system-ui\";x3.textAlign=\"center\";x3.fillText(\"+\",BX,G1.ball.y+4);\n  x3.fillStyle=c;x3.font=\"14px system-ui\";x3.textAlign=\"left\";\n  x3.fillText(`Ball: ${G1.score}   Hayot: ${\"❤️\".repeat(Math.max(0,G1.lives))}`,10,20);\n  if(G1.holding){x3.fillStyle=\"#e5484d\";x3.textAlign=\"right\";x3.fillText(\"E ↑\",350,20)}\n  else if(G1.run){x3.fillStyle=\"#2f7de1\";x3.textAlign=\"right\";x3.fillText(\"E ↓\",350,20)}\n  if(!G1.run){\n    x3.fillStyle=c;x3.textAlign=\"center\";x3.font=\"bold 16px system-ui\";\n    x3.fillText(G1.over?\"O'yin tugadi! Qayta boshlash uchun bosing\":\"Boshlash uchun bosing\",180,150);\n  }\n  $(\"g1i\").textContent=G1.over?`O'yin tugadi. Ball: ${G1.score}`:\"Ushlab turing = maydon yuqoriga, qoʻyib yuboring = maydon pastga\";\n}\nfunction stepG1(){\n  if(!G1.run)return;\n  G1.frame++;\n  const acc=G1.holding?-0.24:0.24;\n  G1.ball.v=G1.ball.v*0.97+acc;\n  G1.ball.y+=G1.ball.v;\n  if(G1.frame%95===0)G1.walls.push({x:360,gy:Math.round(rnd(70,230)),hit:false,passed:false});\n  G1.walls.forEach(w=>w.x-=2.2);\n  G1.walls.forEach(w=>{\n    if(!w.passed&&w.x+18<BX-8){w.passed=true;G1.score++}\n    if(!w.hit&&w.x<BX+8&&w.x+18>BX-8){\n      const inGap=G1.ball.y>w.gy-40&&G1.ball.y<w.gy+40;\n      if(!inGap){w.hit=true;loseLife()}\n    }\n  });\n  G1.walls=G1.walls.filter(w=>w.x>-30);\n  if(G1.ball.y<8||G1.ball.y>292)loseLife();\n  if(!G1.run)return;\n  drawG1();\n  requestAnimationFrame(stepG1);\n}\nfunction loseLife(){\n  G1.lives--;\n  G1.ball={y:150,v:0};\n  if(G1.lives<=0){G1.run=false;G1.over=true;}\n}\nc3.onpointerdown=e=>{\n  e.preventDefault();\n  G1.holding=true;\n  if(G1.over)resetG1();\n  if(!G1.run){G1.run=true;requestAnimationFrame(stepG1)}\n  drawG1();\n};\nc3.onpointerup=()=>{G1.holding=false};\nc3.onpointerleave=()=>{G1.holding=false};\nc3.onpointercancel=()=>{G1.holding=false};\nresetG1();\n\n/* ---------- 2-oʻyin: hisoblash ---------- */\nlet G2={n:0,s:0,locked:false};\nfunction round2(){\n  G2.locked=false;\n  if(G2.n>=10){\n    $(\"g2q\").textContent=`Natija: ${G2.s} / 10`;\n    $(\"g2m\").textContent=G2.s>=8?\"🏆 Ajoyib!\":G2.s>=5?\"👍 Yaxshi\":\"📚 Formulalarni qayta koʻring\";\n    $(\"g2o\").innerHTML=\"\";\n    const b=document.createElement(\"button\");b.className=\"btn\";b.textContent=\"Qayta oʻynash\";\n    b.onclick=()=>{G2={n:0,s:0,locked:false};round2()};\n    $(\"g2o\").appendChild(b);\n    return;\n  }\n  let E,text;\n  if(Math.random()<0.5){\n    const q=1+Math.floor(Math.random()*9);\n    const F=(1+Math.floor(Math.random()*9))/10;\n    E=F/(q*1e-6);\n    text=`Zaryad q = ${q} μC ga taʼsir qiluvchi kuch F = ${num(F,1)} N. Maydon kuchlanganligi E = F/q ?`;\n  }else{\n    const q=1+Math.floor(Math.random()*9);\n    const r=10*(1+Math.floor(Math.random()*5));\n    E=K*q*1e-6/((r/100)**2);\n    text=`Nuqtaviy zaryad q = ${q} μC dan r = ${r} sm masofadagi nuqtada maydon kuchlanganligi?`;\n  }\n  const dis=[E*10,E/10,E*2,E/2].sort(()=>Math.random()-.5).slice(0,3);\n  const opts=[{v:E,ok:true},...dis.map(v=>({v,ok:false}))].sort(()=>Math.random()-.5);\n  $(\"g2q\").textContent=`Savol ${G2.n+1}/10 · ${text}`;\n  $(\"g2m\").textContent=`Ball: ${G2.s}`;\n  $(\"g2o\").innerHTML=\"\";\n  opts.forEach(o=>{\n    const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=fmtE(o.v)+\" N/C\";\n    b.onclick=()=>{\n      if(G2.locked)return;G2.locked=true;\n      [...$(\"g2o\").children].forEach((x,i)=>{if(opts[i].ok)x.classList.add(\"right\")});\n      if(o.ok){G2.s++;$(\"g2m\").textContent=\"✅ Toʻgʻri!\"}\n      else{b.classList.add(\"bad\");$(\"g2m\").textContent=\"❌ Notoʻgʻri. Yashil javob toʻgʻri.\"}\n      G2.n++;\n      setTimeout(round2,1600);\n    };\n    $(\"g2o\").appendChild(b);\n  });\n}\n\n/* ---------- Test ---------- */\nconst T=[\n[\"Maydon kuchlanganligi birligi qaysi?\",[\"N/C\",\"C/N\",\"J/C\",\"N·m\"],0],\n[\"q = 2 μC zaryadga E = 5·10⁴ N/C maydonda taʼsir qiluvchi kuch qancha?\",[\"0,1 N\",\"10 N\",\"0,01 N\",\"1 N\"],0],\n[\"Musbat sinov zaryadiga taʼsir kuchi maydon kuchlanganligi bilan qanday yoʻnalgan?\",[\"Bir xil yoʻnalgan\",\"Qarama-qarshi yoʻnalgan\",\"Perpendikulyar\",\"Nolga teng\"],0],\n[\"Manfiy zaryad (elektron) maydonga joylashtirilsa, kuch qanday yoʻnalgan?\",[\"Maydon yoʻnalishi bilan bir xil\",\"Maydon yoʻnalishiga qarama-qarshi\",\"Maydonga perpendikulyar\",\"Har doim nol\"],1],\n[\"Nuqtaviy zaryad maydon kuchlanganligi formulasi qaysi?\",[\"E = k·q / r²\",\"E = F·q\",\"E = q·U\",\"E = k·q·r\"],0],\n[\"Zaryaddan masofa 2 marta oshirilsa, maydon kuchlanganligi qanday oʻzgaradi?\",[\"2 marta kamayadi\",\"4 marta kamayadi\",\"2 marta ortadi\",\"Oʻzgarmaydi\"],1],\n[\"Tekis nish?\",[\"10 V\",\"40 V\",\"1000 V\",\"0,25 V\"],0],\n[\"Bir jinsli maydonda musbat zaryad harakati uchun qaysi toʻgʻri?\",[\"Maydon yoʻnalishida tezlanadi\",\"Maydonga qarshi tezlanadi\",\"Harakatsiz qoladi\",\"Faqat aylana boʻylab harakatlanadi\"],0]\n];\nlet ti=0,ts=0,done=false;\nfunction tq(){\n  done=false;\n  if(ti>=20){\n    $(\"pb\").style.width=\"100%\";$(\"tn\").textContent=\"\";\n    $(\"tq\").textContent=`Natija: ${ts} / 20 (${ts*5}%)`;\n    $(\"to\").innerHTML=`<p>${ts>=18?\"🏆 Mukammal!\":ts>=14?\"👍 Juda yaxshi!\":ts>=10?\"🙂 Yaxshi, yana mashq qiling.\":\"📚 Nazariyani qayta oʻqib chiqing.\"}<\/p>`;\n    $(\"tx\").style.display=\"\";$(\"tx\").textContent=\"Qayta boshlash\";\n    return;\n  }\n  const q=T[ti];\n  $(\"tx\").style.display=\"none\";\n  $(\"pb\").style.width=(ti/20*100)+\"%\";\n  $(\"tn\").textContent=`Savol ${ti+1} / 20 · Toʻgʻri: ${ts}`;\n  $(\"tq\").textContent=q[0];\n  $(\"to\").innerHTML=\"\";\n  q[1].forEach((o,i)=>{\n    const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=o;\n    b.onclick=()=>{\n      if(done)return;done=true;\n      [...$(\"to\").children][q[2]].classList.add(\"right\");\n      if(i===q[2])ts++;else b.classList.add(\"bad\");\n      $(\"tx\").style.display=\"\";$(\"tx\").textContent=ti===19?\"Natijani koʻrish\":\"Keyingisi\";\n    };\n    $(\"to\").appendChild(b);\n  });\n}\n$(\"tx\").onclick=()=>{\n  if(ti>=20){ti=0;ts=0}else{ti++}\n  tq();\n};\n\n/* ---------- Ishga tushirish ---------- */\nshow(0);\ndrawSim1();\ndrawSim2();\nround2();\ntq();\n"}, {"title": "O'tkazgichlarda zaryadlar taqsimoti", "emoji": "🔌", "css": "\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fb;--card:#fff;--tx:#1c2333;--mu:#5b6578;--ac:#3b6cf6;--pos:#e5484d;--neg:#2f7de1;--ok:#17a673;--bd:#dde3ef}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;--bg:#0f1420;--card:#18202f;--tx:#e8ecf5;--mu:#9aa5bb;--ac:#6b93ff;--bd:#2a3550}}\n:root[data-theme=\"dark\"]{color-scheme:dark;--bg:#0f1420;--card:#18202f;--tx:#e8ecf5;--mu:#9aa5bb;--ac:#6b93ff;--bd:#2a3550}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader{padding:18px 16px 8px;max-width:760px;margin:auto}\nh1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--mu);font-size:14px}\nnav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:760px;margin:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}\nnav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:20px;font-size:14px;cursor:pointer}\nnav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}\nmain{max-width:760px;margin:auto;padding:8px 16px 40px}\nsection{display:none}section.on{display:block}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:10px 0}\nh2{font-size:19px;margin:6px 0}h3{font-size:16px;margin:0 0 6px}\n.card p{margin:6px 0}.f{font-weight:700;background:var(--bg);padding:8px 12px;border-radius:10px;display:inline-block}\ncanvas{width:100%;max-width:100%;border-radius:12px;background:var(--bg);border:1px solid var(--bd);display:block;margin:8px 0}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}\n.btn{border:0;background:var(--ac);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;cursor:pointer}\ninput[type=range]{width:100%}\nlabel{display:block;font-size:14px;color:var(--mu)}\n.out{font-weight:600}.mu{color:var(--mu);font-size:14px}\n.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}\n.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:var(--pos);color:#fff;border-color:var(--pos)}\n.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0}\n", "body": "\n<header><h1>🔌 O'tkazgichlarda zaryadlar taqsimoti<\/h1><p>Nazariya, simulyatsiya, oʻyin va test<\/p><\/header>\n<nav id=\"nav\"><\/nav>\n<main>\n\n<section id=\"s0\" class=\"on\">\n<div class=\"card\"><h3>1. O'tkazgich va zaryad<\/h3>\n<p>O'tkazgichda (metall) erkin elektronlar bor. Ular zaryadlangan jism yuzasiga <b>oʻzaro itarilib<\/b>, bir-biridan iloji boricha uzoqlashadi. Shuning uchun ortiqcha zaryad <b>faqat sirtda<\/b> joylashadi.<\/p><\/div>\n<div class=\"card\"><h3>2. Muvozanat sharti<\/h3>\n<p>Elektrostatik muvozanatda o'tkazgich ichidagi maydon <b>nolga teng<\/b>, butun o'tkazgich bir xil <b>potensialda<\/b> boʻladi. Agar ichida maydon boʻlsa, erkin zaryadlar harakatlanib, muvozanat buziladi.<\/p><\/div>\n<div class=\"card\"><h3>3. Sirt zichligi<\/h3>\n<p>Sirt zichligi: <span class=\"f\">σ = q / S<\/span> (birligi: C/m²)<\/p>\n<p>Sferik o'tkazgich uchun: <span class=\"f\">σ = q / (4πR²)<\/span><\/p>\n<p>Zaryad egrilik radiusi kichik joylarda (uchlarda) <b>zichroq<\/b> toʻplanadi. Shuning uchun <b>uchli<\/b> joylarda sirt zichligi va maydon kuchli boʻladi (uchi effekti).<\/p><\/div>\n<div class=\"card\"><h3>4. Sirt yaqinidagi maydon<\/h3>\n<p>O'tkazgich sirti yaqinida maydon kuchlanganligi: <span class=\"f\">E = σ / ε₀<\/span>, &nbsp; ε₀ = 8,85·10⁻¹² F/m<\/p><\/div>\n<div class=\"card\"><h3>5. Tegizish va zaryad taqsimoti<\/h3>\n<p>Ikki o'tkazgich sharni tegizganda ular bir xil potensialga keladi. Zaryad sharlar radiusiga proporsional taqsimlanadi:<\/p>\n<p><span class=\"f\">q₁' / q₂' = R₁ / R₂<\/span><\/p>\n<p>Radiuslari teng boʻlsa, zaryad teng boʻlinadi.<\/p><\/div>\n<div class=\"card\"><h3>6. Ekranlash (Faradey qafasi)<\/h3>\n<p>Ichi boʻsh metall qobiq ichida elektr maydon boʻlmaydi, chunki tashqi maydon qobiq sirtidagi zaryadlar tomonidan kompensatsiyalanadi. Bu <b>elektrostatik ekranlash<\/b> deyiladi. Ichkarida joylashgan zaryad qobiqning ichki sirtida teng qarama-qarshi zaryad hosil qiladi.<\/p><\/div>\n<\/section>\n\n<section id=\"s1\">\n<h2>🧪 1-simulyatsiya: Ikki sharning tegishi<\/h2>\n<p class=\"mu\">Pastki qatorda sharlar tegishdan keyingi holat. Sharlarning radiusini va umumiy zaryadni oʻzgartiring. Nuqtalar sirt zichligini koʻrsatadi: qancha kichik radius — shuncha katta nuqta.<\/p>\n<label>1-shar radiusi R₁ = <span id=\"vr1\"><\/span> sm<\/label><input type=\"range\" id=\"r1\" min=\"1\" max=\"5\" step=\"1\" value=\"1\">\n<label>2-shar radiusi R₂ = <span id=\"vr2\"><\/span> sm<\/label><input type=\"range\" id=\"r2\" min=\"1\" max=\"5\" step=\"1\" value=\"3\">\n<label>Dastlabki zaryad (1-sharda) Q = <span id=\"vQ\"><\/span> μC<\/label><input type=\"range\" id=\"Q\" min=\"1\" max=\"10\" step=\"1\" value=\"8\">\n<canvas id=\"c1\" width=\"360\" height=\"230\"><\/canvas>\n<div class=\"out\" id=\"i1\"><\/div>\n<\/section>\n\n<section id=\"s2\">\n<h2>🧪 2-simulyatsiya: Uchli o'tkazgich<\/h2>\n<p class=\"mu\">Ellips shaklidagi o'tkazgich. Qisqa oʻq (b) ni kichraytiring: uchlardagi egrilik kuchayadi va zaryad oʻsha joylarga koʻproq toʻplanadi. Nuqtalar sirt zichligini koʻrsatadi.<\/p>\n<label>Qisqa yarim oʻq b = <span id=\"evb\"><\/span> (katta yarim oʻq a = 130)<\/label><input type=\"range\" id=\"eb\" min=\"30\" max=\"120\" step=\"2\" value=\"50\">\n<canvas id=\"c2\" width=\"360\" height=\"260\"><\/canvas>\n<div class=\"out\" id=\"i2\"><\/div>\n<\/section>\n\n<section id=\"s3\">\n<h2>🎮 1-oʻyin: Tegishdan keyin zaryad<\/h2>\n<p class=\"mu\">Ikki sharning dastlabki zaryadi va radiuslari berilgan. Ular tegizilgandan keyin 1-sharda qancha zaryad qolishini toping. Jami 10 savol.<\/p>\n<div class=\"card\">\n<p class=\"out\" id=\"g1q\"><\/p>\n<div id=\"g1o\"><\/div>\n<p class=\"out\" id=\"g1m\"><\/p>\n<\/div>\n<\/section>\n\n<section id=\"s4\">\n<h2>🎮 2-oʻyin: Eng katta sirt zichligi<\/h2>\n<p class=\"mu\">Har bir sharning zaryadi va radiusi berilgan. Qaysi sharda sirt zichligi eng katta? Jami 10 savol.<\/p>\n<div class=\"card\">\n<p class=\"out\" id=\"g2q\"><\/p>\n<div id=\"g2o\"><\/div>\n<p class=\"out\" id=\"g2m\"><\/p>\n<\/div>\n<\/section>\n\n<section id=\"s5\">\n<h2>📝 Test (20 ta savol)<\/h2>\n<div class=\"card\"><div class=\"bar\"><i id=\"pb\"><\/i><\/div><p class=\"mu\" id=\"tn\"><\/p><h3 id=\"tq\"><\/h3><div id=\"to\"><\/div><div class=\"row\"><button class=\"btn\" id=\"tx\" style=\"display:none\">Keyingisi<\/button><\/div><\/div>\n<\/section>\n<\/main>\n\n", "js": "\nconst $=id=>document.getElementById(id);\nconst EPS0=8.85e-12;\nconst col=()=>getComputedStyle(document.body).color;\nconst num=(x,d)=>x.toFixed(d).replace(\".\",\",\");\nconst SUP={\"-\":\"⁻\",\"0\":\"⁰\",\"1\":\"¹\",\"2\":\"²\",\"3\":\"³\",\"4\":\"⁴\",\"5\":\"⁵\",\"6\":\"⁶\",\"7\":\"⁷\",\"8\":\"⁸\",\"9\":\"⁹\"};\nconst sup=n=>String(n).split(\"\").map(c=>SUP[c]).join(\"\");\nfunction fmtE(x){\n  const a=Math.abs(x);\n  if(a===0)return \"0\";\n  const e=Math.floor(Math.log10(a));\n  return num(x/10**e,2)+\"·10\"+(e<0?\"⁻\":\"\")+sup(Math.abs(e));\n}\n// sirt zichligi, C/m²; q — μC, R — sm\nconst sigma=(q,R)=>Math.abs(q)*1e-6/(4*Math.PI*(R/100)**2);\n\n/* ---------- Navigatsiya ---------- */\nconst tabs=[\"📖 Nazariya\",\"🧪 Ikki shar\",\"🧪 Uchli o'tkazgich\",\"🎮 Tegishdan keyin\",\"🎮 Sirt zichligi\",\"📝 Test\"];\nfunction show(n){\n  document.querySelectorAll(\"section\").forEach((s,i)=>s.classList.toggle(\"on\",i===n));\n  [...$(\"nav\").children].forEach((b,i)=>b.classList.toggle(\"on\",i===n));\n}\ntabs.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;b.onclick=()=>show(i);$(\"nav\").appendChild(b)});\n\n/* ---------- 1-simulyatsiya: ikki shar ---------- */\nconst c1=$(\"c1\"),x1=c1.getContext(\"2d\");\nfunction sph(x,y,R,q,sMax){\n  const rp=R*9;\n  x1.fillStyle=q>0?\"rgba(229,72,77,0.22)\":q<0?\"rgba(47,125,225,0.22)\":\"rgba(138,148,168,0.15)\";\n  x1.beginPath();x1.arc(x,y,rp,0,7);x1.fill();\n  x1.strokeStyle=q>0?\"#e5484d\":q<0?\"#2f7de1\":\"#8a94a8\";x1.lineWidth=2;x1.beginPath();x1.arc(x,y,rp,0,7);x1.stroke();\n  const s=sigma(q,R);\n  const dr=sMax>0?1+4*s/sMax:1;\n  x1.fillStyle=q>=0?\"#e5484d\":\"#2f7de1\";\n  for(let k=0;k<24;k++){\n    const a=2*Math.PI*k/24;\n    x1.beginPath();x1.arc(x+rp*Math.cos(a),y+rp*Math.sin(a),dr,0,7);x1.fill();\n  }\n}\nfunction drawSim1(){\n  const R1=+$(\"r1\").value,R2=+$(\"r2\").value,Q=+$(\"Q\").value;\n  $(\"vr1\").textContent=R1;$(\"vr2\").textContent=R2;$(\"vQ\").textContent=Q;\n  const q1=Q*R1/(R1+R2),q2=Q*R2/(R1+R2);\n  const sb=Math.max(sigma(Q,R1),sigma(0,R2)),sa=Math.max(sigma(q1,R1),sigma(q2,R2));\n  x1.clearRect(0,0,360,230);\n  const c=col();\n  x1.fillStyle=c;x1.font=\"bold 13px system-ui\";x1.textAlign=\"left\";\n  x1.fillText(\"Tegishdan oldin\",8,14);\n  sph(100,65,R1,Q,sb);\n  sph(260,65,R2,0,sb);\n  x1.fillStyle=c;\n  x1.fillText(\"Tegishdan keyin\",8,122);\n  sph(100,172,R1,q1,sa);\n  sph(260,172,R2,q2,sa);\n  $(\"i1\").innerHTML=`q₁' = Q·R₁/(R₁+R₂) = ${Q}·${R1}/(${R1}+${R2}) = <b>${num(q1,2)} μC<\/b><br>\n    q₂' = Q·R₂/(R₁+R₂) = <b>${num(q2,2)} μC<\/b><br>\n    σ₁ = ${fmtE(sigma(q1,R1))} C/m², σ₂ = ${fmtE(sigma(q2,R2))} C/m²<br>\n    <span class=\"mu\">Potensiallar teng: kichik sharda sirt zichligi katta.<\/span>`;\n}\n[\"r1\",\"r2\",\"Q\"].forEach(i=>$(i).oninput=drawSim1);\n\n/* ---------- 2-simulyatsiya: uchli o'tkazgich ---------- */\nconst c2=$(\"c2\"),x2=c2.getContext(\"2d\");\nfunction drawSim2(){\n  const b=+$(\"eb\").value,a=130,cx=180,cy=130;\n  $(\"evb\").textContent=b;\n  x2.clearRect(0,0,360,260);\n  const c=col();\n  x2.strokeStyle=c;x2.lineWidth=2;x2.beginPath();\n  for(let i=0;i<=120;i++){\n    const t=2*Math.PI*i/120;\n    const px=cx+a*Math.cos(t),py=cy+b*Math.sin(t);\n    i===0?x2.moveTo(px,py):x2.lineTo(px,py);\n  }\n  x2.stroke();\n  const N=60;const pts=[];let smax=0;\n  for(let i=0;i<N;i++){\n    const t=2*Math.PI*i/N;\n    const q=a*a*Math.sin(t)**2+b*b*Math.cos(t)**2;\n    const R=Math.pow(q,1.5)/(a*b);\n    const sig=1/R;\n    pts.push({px:cx+a*Math.cos(t),py:cy+b*Math.sin(t),sig});\n    if(sig>smax)smax=sig;\n  }\n  x2.fillStyle=\"#e5484d\";\n  pts.forEach(p=>{x2.beginPath();x2.arc(p.px,p.py,1+5*p.sig/smax,0,7);x2.fill()});\n  const Rmin=b*b/a;\n  $(\"i2\").innerHTML=`Uchlardagi egrilik radiusi: R<sub>min<\/sub> = b²/a = <b>${num(Rmin,1)}<\/b> (birlik). Katta egrilik — katta zichlik.<br>\n  <span class=\"mu\">b kamaysa, uchlarda nuqtalar kattalashadi: bu zaryadning uchlarga toʻplanishi (uchi effekti).<\/span>`;\n}\n$(\"eb\").oninput=drawSim2;\n\n/* ---------- 1-oʻyin: tegishdan keyin ---------- */\nlet G1={n:0,s:0,locked:false};\nfunction round1(){\n  G1.locked=false;\n  if(G1.n>=10){\n    $(\"g1q\").textContent=`Natija: ${G1.s} / 10`;\n    $(\"g1m\").textContent=G1.s>=8?\"🏆 Ajoyib!\":G1.s>=5?\"👍 Yaxshi\":\"📚 Nisbat qoidasini qayta koʻring\";\n    $(\"g1o\").innerHTML=\"\";\n    const b=document.createElement(\"button\");b.className=\"btn\";b.textContent=\"Qayta oʻynash\";\n    b.onclick=()=>{G1={n:0,s:0,locked:false};round1()};\n    $(\"g1o\").appendChild(b);\n    return;\n  }\n  const rnd=n=>1+Math.floor(Math.random()*n);\n  let Q1,Q2,R1,R2,opts;\n  while(true){\n    Q1=rnd(9);Q2=rnd(9);R1=rnd(5);R2=rnd(5);\n    if(R1===R2)continue;\n    const corr=(Q1+Q2)*R1/(R1+R2);\n    const cand=[(Q1+Q2)/2,Q1,(Q1+Q2)*R2/(R1+R2)].map(v=>+v.toFixed(2));\n    const all=[+corr.toFixed(2),...cand];\n    if(new Set(all).size===4){\n      opts=all.map((v,i)=>({v,ok:i===0}));\n      break;\n    }\n  }\n  opts.sort(()=>Math.random()-.5);\n  $(\"g1q\").textContent=`Savol ${G1.n+1}/10: 1-sharda Q₁ = ${Q1} μC, R₁ = ${R1} sm; 2-sharda Q₂ = ${Q2} μC, R₂ = ${R2} sm. Tegizilgandan keyin 1-sharda qancha zaryad boʻladi?`;\n  $(\"g1m\").textContent=`Ball: ${G1.s}`;\n  const box=$(\"g1o\");box.innerHTML=\"\";\n  opts.forEach(o=>{\n    const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=num(o.v,2)+\" μC\";\n    b.onclick=()=>{\n      if(G1.locked)return;G1.locked=true;\n      [...box.children].forEach((x,i)=>{if(opts[i].ok)x.classList.add(\"right\")});\n      if(o.ok){G1.s++;$(\"g1m\").textContent=\"✅ Toʻgʻri! q₁' = (Q₁+Q₂)·R₁/(R₁+R₂)\"}\n      else{b.classList.add(\"bad\");$(\"g1m\").textContent=\"❌ Notoʻgʻri. Radiuslar teng boʻlmaganda zaryad R ga proporsional taqsimlanadi.\"}\n      G1.n++;\n      setTimeout(round1,2000);\n    };\n    box.appendChild(b);\n  });\n}\n\n/* ---------- 2-oʻyin: eng katta sirt zichligi ---------- */\nlet G2={n:0,s:0,locked:false};\nfunction round2(){\n  G2.locked=false;\n  if(G2.n>=10){\n    $(\"g2q\").textContent=`Natija: ${G2.s} / 10`;\n    $(\"g2m\").textContent=G2.s>=8?\"🏆 Ajoyib!\":G2.s>=5?\"👍 Yaxshi\":\"📚 σ = q/(4πR²) formulasini qayta koʻring\";\n    $(\"g2o\").innerHTML=\"\";\n    const b=document.createElement(\"button\");b.className=\"btn\";b.textContent=\"Qayta oʻynash\";\n    b.onclick=()=>{G2={n:0,s:0,locked:false};round2()};\n    $(\"g2o\").appendChild(b);\n    return;\n  }\n  const rnd=n=>1+Math.floor(Math.random()*n);\n  let S;\n  while(true){\n    S=[];\n    for(let i=0;i<4;i++)S.push({q:rnd(9),R:rnd(5)});\n    const vals=S.map(s=>(s.q/(s.R*s.R)).toFixed(4));\n    if(new Set(vals).size===4)break;\n  }\n  const sg=S.map(s=>sigma(s.q,s.R));\n  const ans=sg.indexOf(Math.max(...sg));\n  const L=[\"A\",\"B\",\"C\",\"D\"];\n  $(\"g2q\").textContent=`Savol ${G2.n+1}/10: Qaysi sharda sirt zichligi eng katta?`;\n  $(\"g2m\").textContent=`Ball: ${G2.s}`;\n  const box=$(\"g2o\");box.innerHTML=\"\";\n  S.forEach((s,i)=>{\n    const b=document.createElement(\"button\");b.className=\"opt\";\n    b.textContent=`${L[i]}: q = ${s.q} μC, R = ${s.R} sm`;\n    b.onclick=()=>{\n      if(G2.locked)return;G2.locked=true;\n      [...box.children][ans].classList.add(\"right\");\n      const info=S.map((x,j)=>`${L[j]}: σ = ${fmtE(sg[j])} C/m²`).join(\", \");\n      if(i===ans){G2.s++;$(\"g2m\").textContent=\"✅ Toʻgʻri! \"+info}\n      else{b.classList.add(\"bad\");$(\"g2m\").textContent=\"❌ Notoʻgʻri. \"+info}\n      G2.n++;\n      setTimeout(round2,2200);\n    };\n    box.appendChild(b);\n  });\n}\n\n/* ---------- Test ---------- */\nconst T=[\n[\"Ortiqcha zaryad zaryadlangan o'tkazgichda qayerda joylashadi?\",[\"Sirtida\",\"Ichida\",\"Markazda\",\"Hammasi bir xil\"],0],\n[\"Zaryadlangan o'tkazgich ichidagi elektr maydon kuchlanganligi?\",[\"0\",\"Juda katta\",\"Zaryadga teng\",\"Sirtdagiga teng\"],0],\n[\"R₁ = 2R₂ bo'lgan ikki o'tkazgich sharni tegizdik. q₁' / q₂' nisbati?\",[\"1\",\"2\",\"0,5\",\"4\"],1],\n[\"Sirt zichligi egrilik radiusi kichik joylarda qanday boʻladi?\",[\"Katta\",\"Kichik\",\"Nolga teng\",\"Bir xil\"],0],\n[\"Sferik o'tkazgich uchun sirt zichligi formulasi qaysi?\",[\"σ = q / (4πR²)\",\"σ = q·R\",\"σ = k·q / R\",\"σ = q / (2πR)\"],0],\n[\"Zaryad miqdori bir xil, radius 2 marta katta bo'lgan sferada sirt zichligi qanday o'zgaradi?\",[\"2 marta kamayadi\",\"4 marta kamayadi\",\"2 marta ortadi\",\"O'zgarmaydi\"],1],\n[\"O'tkazgich sirti yaqinidagi maydon kuchlanganligi qaysi formula bilan topiladi?\",[\"E = σ / ε₀\",\"E = σ·ε₀\",\"E = ε₀ / σ\",\"E = 2σ\"],0],\n[\"Ichi bo'sh metall qobiq ichidagi (qobiqda zaryad bo'lmaganda) elektr maydon?\",[\"Nolga teng\",\"Juda katta\",\"Tashqaridagiga teng\",\"Qobiq qalinligiga bog'liq\"],0],\n[\"Zaryadlangan o'tkazgich yerga ulansa nima yuz beradi?\",[\"Zaryad yerga oqib ketadi\",\"Zaryad ortadi\",\"Zaryad ichida qoladi\",\"Potensial ortadi\"],0],\n[\"Ikki bir xil sharga +10 μC va −4 μC berib tegizildi. Har birining yakuniy zaryadi?\",[\"+3 μC\",\"+6 μC\",\"−3 μC\",\"+7 μC\"],0],\n[\"R₁ = 1 sm, R₂ = 3 sm. 1-sharda 8 μC, 2-sharda 0. Tegizilgandan keyin 1-sharda qancha zaryad?\",[\"2 μC\",\"6 μC\",\"4 μC\",\"8 μC\"],0],\n[\"Yuqoridagi masalada 2-sharda qancha zaryad qoladi?\",[\"2 μC\",\"6 μC\",\"4 μC\",\"8 μC\"],1],\n[\"Paratonchi (yashin o'tkazgich) uchi nega o'tkir qilinadi?\",[\"Uchi effekti: zaryad uchda toʻplanib, maydon kuchayadi\",\"Magnit maydonni oshirish uchun\",\"Zaryadni yig'ish uchun\",\"Issiqlik chiqarish uchun\"],0],\n[\"O'tkazgichda elektr tokini ta'minlovchi zarralar qaysilar?\",[\"Erkin elektronlar\",\"Protonlar\",\"Neytronlar\",\"Atomlar\"],0],\n[\"R = 0,1 m radiusli sferik o'tkazgichda q = 2 μC. Sirt zichligi?\",[\"1,6·10⁻⁵ C/m²\",\"1,6·10⁻⁴ C/m²\",\"2·10⁻⁶ C/m²\",\"3,2·10⁻⁵ C/m²\"],0],\n[\"Yuqoridagi sirt zichligida sirt yaqinidagi maydon kuchlanganligi (ε₀ = 8,85·10⁻¹² F/m)?\",[\"1,8·10⁶ N/C\",\"1,8·10⁵ N/C\",\"1,4·10⁻¹⁷ N/C\",\"9·10⁹ N/C\"],0],\n[\"Radiuslari teng ikki o'tkazgich sharni tegizib ajratdik. Zaryadlar qanday taqsimlanadi?\",[\"Teng boʻlinadi\",\"Katta sharga koʻproq\",\"Kichik sharga koʻproq\",\"Hech kimga\"],0],\n[\"Elektrostatik ekranlash nima uchun ishlatiladi?\",[\"Tashqi elektr maydonni ichkaridan himoyalash uchun\",\"Magnit maydonni kuchaytirish uchun\",\"Zaryadni yig'ish uchun\",\"Issiqlikni o'tkazish uchun\"],0],\n[\"Neytral metall qobiq ichida +q zaryad bor. Qobiqning ichki sirtida qanday zaryad paydo bo'ladi?\",[\"−q\",\"+q\",\"0\",\"+2q\"],0],\n[\"Tegizilgandan keyin ikki o'tkazgichning potensiallari qanday boʻladi?\",[\"Teng boʻladi\",\"Nolga teng boʻladi\",\"Kattasi ortadi\",\"Ishorasi almashadi\"],0]\n];\nlet ti=0,ts=0,done=false;\nfunction tq(){\n  done=false;\n  if(ti>=20){\n    $(\"pb\").style.width=\"100%\";$(\"tn\").textContent=\"\";\n    $(\"tq\").textContent=`Natija: ${ts} / 20 (${ts*5}%)`;\n    $(\"to\").innerHTML=`<p>${ts>=18?\"🏆 Mukammal!\":ts>=14?\"👍 Juda yaxshi!\":ts>=10?\"🙂 Yaxshi, yana mashq qiling.\":\"📚 Nazariyani qayta oʻqib chiqing.\"}<\/p>`;\n    $(\"tx\").style.display=\"\";$(\"tx\").textContent=\"Qayta boshlash\";\n    return;\n  }\n  const q=T[ti];\n  $(\"tx\").style.display=\"none\";\n  $(\"pb\").style.width=(ti/20*100)+\"%\";\n  $(\"tn\").textContent=`Savol ${ti+1} / 20 · Toʻgʻri: ${ts}`;\n  $(\"tq\").textContent=q[0];\n  $(\"to\").innerHTML=\"\";\n  q[1].forEach((o,i)=>{\n    const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=o;\n    b.onclick=()=>{\n      if(done)return;done=true;\n      [...$(\"to\").children][q[2]].classList.add(\"right\");\n      if(i===q[2])ts++;else b.classList.add(\"bad\");\n      $(\"tx\").style.display=\"\";$(\"tx\").textContent=ti===19?\"Natijani koʻrish\":\"Keyingisi\";\n    };\n    $(\"to\").appendChild(b);\n  });\n}\n$(\"tx\").onclick=()=>{\n  if(ti>=20){ti=0;ts=0}else{ti++}\n  tq();\n};\n\n/* ---------- Ishga tushirish ---------- */\nshow(0);\ndrawSim1();\ndrawSim2();\nround1();\nround2();\ntq();\n"}, {"title": "Tabiatdagi elektr hodisalar", "emoji": "⛈️", "css": "\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fb;--card:#fff;--tx:#1c2333;--mu:#5b6578;--ac:#3b6cf6;--pos:#e5484d;--neg:#2f7de1;--ok:#17a673;--bd:#dde3ef}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;--bg:#0f1420;--card:#18202f;--tx:#e8ecf5;--mu:#9aa5bb;--ac:#6b93ff;--bd:#2a3550}}\n:root[data-theme=\"dark\"]{color-scheme:dark;--bg:#0f1420;--card:#18202f;--tx:#e8ecf5;--mu:#9aa5bb;--ac:#6b93ff;--bd:#2a3550}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader{padding:18px 16px 8px;max-width:760px;margin:auto}\nh1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--mu);font-size:14px}\nnav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:760px;margin:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}\nnav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:20px;font-size:14px;cursor:pointer}\nnav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}\nmain{max-width:760px;margin:auto;padding:8px 16px 40px}\nsection{display:none}section.on{display:block}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:10px 0}\nh2{font-size:19px;margin:6px 0}h3{font-size:16px;margin:0 0 6px}\n.card p{margin:6px 0}.f{font-weight:700;background:var(--bg);padding:8px 12px;border-radius:10px;display:inline-block}\ncanvas{width:100%;max-width:100%;border-radius:12px;background:var(--bg);border:1px solid var(--bd);touch-action:none;display:block;margin:8px 0}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}\n.btn{border:0;background:var(--ac);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;cursor:pointer}\ninput[type=range]{width:100%}\nlabel{display:block;font-size:14px;color:var(--mu)}\n.out{font-weight:600}.mu{color:var(--mu);font-size:14px}\n.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}\n.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:var(--pos);color:#fff;border-color:var(--pos)}\n.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0}\n", "body": "\n<header><h1>⛈️ Tabiatdagi elektr hodisalar<\/h1><p>Chaqmoq, statik elektr, atmosfera va tirik organizmlar<\/p><\/header>\n<nav id=\"nav\"><\/nav>\n<main>\n\n<section id=\"s0\" class=\"on\">\n<div class=\"card\"><h3>1. Statik elektr<\/h3>\n<p>Ikki jism bir-biriga ishqalanganda elektronlar bir jismdan ikkinchisiga oʻtadi. Natijada jismlar zaryadlanadi. Masalan, sochni taroq bilan tarashda yoki kiyimni yechishda chiqadigan “chaqnash” shu hodisadir.<\/p><\/div>\n<div class=\"card\"><h3>2. Chaqmoq<\/h3>\n<p>Momaqaldiroq bulutlarida muz zarralari toʻqnashib, bulutning <b>yuqori qismi musbat<\/b>, <b>pastki qismi manfiy<\/b> zaryadlanadi. Maydon kuchlanganligi havoning elektr mustahkamligidan (taxminan <span class=\"f\">3·10⁶ V/m<\/span>) oshganda havo ionlashadi va bulut bilan yer (yoki bulutlar) orasida katta razryad hosil boʻladi.<\/p>\n<p>Chaqmoqning kuchlanishi taxminan <b>10⁸ V<\/b>, toki <b>30 kA<\/b> gacha, energiyasi taxminan <b>10⁹ J<\/b>.<\/p>\n<p class=\"mu\">Chaqmoq koʻrinib, ovoz keyin eshitiladi, chunki yorugʻlik tovushdan ancha tezroq tarqaladi. Ovoz 3 s kechiksa, masofa taxminan 340 · 3 ≈ 1 km.<\/p><\/div>\n<div class=\"card\"><h3>3. Yer atmosferasining elektr maydoni<\/h3>\n<p>Yer sirti manfiy, yuqori atmosfera (ionosfera) musbat zaryadlangan. Yer yuzasi yaqinida maydon taxminan <span class=\"f\">100 V/m<\/span> boʻlib, <b>pastga<\/b> (yerga tomon) yoʻnalgan. Balandlik oshgani sari maydon kamayadi.<\/p>\n<p>Bulutlar, chaqmoq va ionosfera orasida Yer-atmosfera <b>global elektr zanjiri<\/b> mavjud.<\/p><\/div>\n<div class=\"card\"><h3>4. Paratonchi<\/h3>\n<p>Paratonchi (yashin oʻtkazgich) uchli metall tayoqcha boʻlib, yer bilan yaxshi ulangan. Uchida zaryad toʻplanadi va maydon kuchayadi, shuning uchun chaqmoq aynan shu nuqtaga tushadi va zaryad yerga oqib ketadi. Shu yoʻl bilan bino himoyalanadi.<\/p><\/div>\n<div class=\"card\"><h3>5. Sankt-Elmo olovi<\/h3>\n<p>Baland va uchli joylarda (dengiz kemalari sarigʻi, minora uchlari) kuchli maydon havoni ionlashtiradi va zaʼif yorugʻlik hosil qiladi. Bu <b>uchi effekti<\/b>ning natijasi.<\/p><\/div>\n<div class=\"card\"><h3>6. Tirik organizmlarda elektr<\/h3>\n<p>Nerv hujayralari membranasi orqali elektr impulslari uzatiladi. Tinch holatdagi membrana potensiali taxminan <b>−70 mV<\/b>. Elektr ilonining elektr organi bir necha yuz volt (taxminan <b>600 V<\/b>) kuchlanish hosil qilishi mumkin.<\/p><\/div>\n<div class=\"card\"><h3>7. Shafaq (aurora)<\/h3>\n<p>Quyosh shamolidagi zaryadlangan zarralar Yer magnit maydoni taʼsirida qutblar yaqinida atmosfera atomlariga urilib, yorugʻlik chiqaradi. Bu hodisada magnit va elektr maydonlarning birgalikdagi taʼsiri muhim rol oʻynaydi.<\/p><\/div>\n<\/section>\n\n<section id=\"s1\">\n<h2>🧪 1-simulyatsiya: Chaqmoq hosil boʻlishi<\/h2>\n<p class=\"mu\">Bulutdagi zaryad ajralishini oshiring. Bulut va yer orasidagi maydon kuchlanganligi E = S · 10⁴ V/m. Agar E havoning elektr mustahkamligi (3·10⁶ V/m) dan katta boʻlsa, chaqmoq urishi mumkin. “Chaqmoq” tugmasini bosing.<\/p>\n<label>Zaryad ajralishi S = <span id=\"lsv\"><\/span> (E = <span id=\"lev\"><\/span> V/m)<\/label><input type=\"range\" id=\"ls\" min=\"0\" max=\"400\" step=\"5\" value=\"200\">\n<div class=\"row\"><button class=\"btn\" id=\"lbtn\">Chaqmoq hosil qilish<\/button><\/div>\n<canvas id=\"c1\" width=\"360\" height=\"290\"><\/canvas>\n<div class=\"out\" id=\"i1\"><\/div>\n<\/section>\n\n<section id=\"s2\">\n<h2>🧪 2-simulyatsiya: Statik elektr — sochlar<\/h2>\n<p class=\"mu\">Odam boshiga taroq yoki sharcha ishqalab zaryad berilgan. Zaryad miqdorini oshiring: bir xil ishorali zaryadlar itarilib, sochlar tik turadi.<\/p>\n<label>Boshdagi zaryad Q = <span id=\"hqv\"><\/span> nC<\/label><input type=\"range\" id=\"hq\" min=\"0\" max=\"10\" step=\"1\" value=\"0\">\n<canvas id=\"c2\" width=\"360\" height=\"260\"><\/canvas>\n<div class=\"out\" id=\"i2\"><\/div>\n<\/section>\n\n<section id=\"s3\">\n<h2>🎮 1-oʻyin: Paratonchi<\/h2>\n<p class=\"mu\">Chaqmoqlar tepadan tushadi. Paratonchini (kulrang tayoqcha) chaqmoq tushadigan joyga siljitib, uni tuting. Ekranni bosib, sudrang. Yerga toʻgʻri tushgan chaqmoq — ball, tushib ketgani — hayot yoʻqotadi. 5 ta hayot bor.<\/p>\n<div class=\"row\"><span class=\"out\" id=\"g3i\">Boshlash uchun ekranni bosing<\/span><\/div>\n<canvas id=\"c3\" width=\"360\" height=\"300\"><\/canvas>\n<\/section>\n\n<section id=\"s4\">\n<h2>🎮 2-oʻyin: Hodisa va qiymat<\/h2>\n<p class=\"mu\">Tabiat hodisasining taxminiy qiymatini toping. Jami 8 savol.<\/p>\n<div class=\"card\">\n<p class=\"out\" id=\"g4q\"><\/p>\n<div id=\"g4o\"><\/div>\n<p class=\"out\" id=\"g4m\"><\/p>\n<\/div>\n<\/section>\n\n<section id=\"s5\">\n<h2>📝 Test (20 ta savol)<\/h2>\n<div class=\"card\"><div class=\"bar\"><i id=\"pb\"><\/i><\/div><p class=\"mu\" id=\"tn\"><\/p><h3 id=\"tq\"><\/h3><div id=\"to\"><\/div><div class=\"row\"><button class=\"btn\" id=\"tx\" style=\"display:none\">Keyingisi<\/button><\/div><\/div>\n<\/section>\n<\/main>\n\n", "js": "\nconst $=id=>document.getElementById(id);\nconst col=()=>getComputedStyle(document.body).color;\nconst num=(x,d)=>x.toFixed(d).replace(\".\",\",\");\nconst SUP={\"-\":\"⁻\",\"0\":\"⁰\",\"1\":\"¹\",\"2\":\"²\",\"3\":\"³\",\"4\":\"⁴\",\"5\":\"⁵\",\"6\":\"⁶\",\"7\":\"⁷\",\"8\":\"⁸\",\"9\":\"⁹\"};\nconst sup=n=>String(n).split(\"\").map(c=>SUP[c]).join(\"\");\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nfunction pos(c,e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}}\n\n/* ---------- Navigatsiya ---------- */\nconst tabs=[\"📖 Nazariya\",\"🧪 Chaqmoq\",\"🧪 Sochlar\",\"🎮 Paratonchi\",\"🎮 Hodisa va qiymat\",\"📝 Test\"];\nfunction show(n){\n  document.querySelectorAll(\"section\").forEach((s,i)=>s.classList.toggle(\"on\",i===n));\n  [...$(\"nav\").children].forEach((b,i)=>b.classList.toggle(\"on\",i===n));\n}\ntabs.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;b.onclick=()=>show(i);$(\"nav\").appendChild(b)});\n\n/* ---------- 1-simulyatsiya: chaqmoq ---------- */\nconst c1=$(\"c1\"),x1=c1.getContext(\"2d\");\nconst LS={bolt:false,path:null,timer:null};\nconst BREAK=3e6;\nfunction drawSim1(){\n  const S=+$(\"ls\").value;\n  const E=S*1e4;\n  $(\"lsv\").textContent=S;$(\"lev\").textContent=E.toExponential(1).replace(\".\",\",\").replace(\"e+\",\"·10^\").replace(\"e\",\"·10^\");\n  x1.clearRect(0,0,360,290);\n  const c=col();\n  // bulut\n  x1.fillStyle=\"#8a94a8\";x1.beginPath();x1.ellipse(180,50,120,28,0,0,7);x1.fill();\n  x1.fillStyle=\"#fff\";x1.font=\"bold 16px system-ui\";x1.textAlign=\"center\";\n  x1.fillText(\"+\",140,46);x1.fillText(\"+\",180,40);x1.fillText(\"+\",220,46);\n  x1.fillStyle=\"#fff\";x1.fillText(\"−\",150,68);x1.fillText(\"−\",180,72);x1.fillText(\"−\",210,68);\n  // yer\n  x1.fillStyle=\"#6b7a8f\";x1.fillRect(0,262,360,28);\n  // maydon chiziqlari\n  const str=Math.min(1,E/BREAK);\n  x1.strokeStyle=\"#f5a524\";x1.lineWidth=1.5;x1.globalAlpha=0.25+0.7*str;\n  [100,180,260].forEach(x=>{\n    x1.beginPath();x1.moveTo(x,80);x1.lineTo(x,250);x1.stroke();\n    x1.beginPath();x1.moveTo(x-4,240);x1.lineTo(x,250);x1.lineTo(x+4,240);x1.stroke();\n  });\n  x1.globalAlpha=1;\n  // chaqmoq\n  if(LS.bolt&&LS.path){\n    x1.strokeStyle=\"#ffd84d\";x1.lineWidth=3;x1.shadowColor=\"#ffd84d\";x1.shadowBlur=12;\n    x1.beginPath();LS.path.forEach((p,i)=>i===0?x1.moveTo(p.x,p.y):x1.lineTo(p.x,p.y));x1.stroke();\n    x1.shadowBlur=0;\n  }\n  const ok=E>=BREAK;\n  $(\"i1\").innerHTML=`E = ${num(E/1e6,2)}·10⁶ V/m. Havoning elektr mustahkamligi: 3·10⁶ V/m.<br>\n    <span class=\"mu\">${ok?\"Maydon yetarli — chaqmoq urishi mumkin.\":\"Maydon yetarli emas — razryad hosil boʻlmaydi.\"}<\/span>`;\n}\nfunction strike(){\n  const E=(+$(\"ls\").value)*1e4;\n  if(E<BREAK){drawSim1();return}\n  const pts=[];\n  let x=180;\n  for(let y=90;y<=262;y+=12){\n    x+=rnd(-14,14);\n    pts.push({x:Math.max(20,Math.min(340,x)),y});\n  }\n  LS.path=pts;LS.bolt=true;\n  clearTimeout(LS.timer);\n  drawSim1();\n  LS.timer=setTimeout(()=>{LS.bolt=false;drawSim1()},900);\n}\n$(\"ls\").oninput=drawSim1;\n$(\"lbtn\").onclick=strike;\n\n/* ---------- 2-simulyatsiya: sochlar ---------- */\nconst c2=$(\"c2\"),x2=c2.getContext(\"2d\");\nfunction drawSim2(){\n  const Q=+$(\"hq\").value;\n  $(\"hqv\").textContent=Q;\n  x2.clearRect(0,0,360,260);\n  const c=col();\n  const hx=180,hy=190,hr=50;\n  // bosh\n  x2.fillStyle=\"rgba(138,148,168,0.35)\";\n  x2.beginPath();x2.arc(hx,hy,hr,0,7);x2.fill();\n  x2.fillStyle=c;x2.font=\"12px system-ui\";x2.textAlign=\"center\";x2.fillText(\"bosh\",hx,hy+4);\n  // sochlar\n  const N=15;\n  const s=Q*0.07;\n  x2.strokeStyle=\"#e5484d\";x2.lineWidth=2;\n  for(let i=0;i<N;i++){\n    const phi=-Math.PI+(i+0.5)*Math.PI/N;\n    const bx=hx+hr*Math.cos(phi),by=hy+hr*Math.sin(phi);\n    const th=phi+s*(phi+Math.PI/2);\n    const L=70;\n    x2.beginPath();x2.moveTo(bx,by);x2.lineTo(bx+L*Math.cos(th),by+L*Math.sin(th));x2.stroke();\n  }\n  $(\"i2\").innerHTML=Q===0\n    ?\"Zaryad yoʻq: sochlar tabiiy holatda.\"\n    :`Bir xil ishorali zaryadlar bir-birini itaradi. Q = ${Q} nC da sochlar ${Math.min(Math.round(Q*6),90)}° ga ochiladi (taxminiy).`;\n}\n$(\"hq\").oninput=drawSim2;\n\n/* ---------- 1-oʻyin: paratonchi ---------- */\nconst c3=$(\"c3\"),x3=c3.getContext(\"2d\");\nconst GROUND=280,ROD_TOP=205,CATCH=45;\nlet G3={run:false,over:false,rod:180,bolts:[],frame:0,score:0,lives:5};\nfunction resetG3(){\n  G3={run:false,over:false,rod:180,bolts:[],frame:0,score:0,lives:5};\n  drawG3();\n}\nfunction drawG3(){\n  x3.clearRect(0,0,360,300);\n  const c=col();\n  // bulut\n  x3.fillStyle=\"#8a94a8\";x3.beginPath();x3.ellipse(180,18,170,14,0,0,7);x3.fill();\n  // yer\n  x3.fillStyle=\"#6b7a8f\";x3.fillRect(0,GROUND,360,20);\n  // himoya doirasi\n  x3.setLineDash([4,4]);x3.strokeStyle=c;x3.lineWidth=1;\n  x3.beginPath();x3.moveTo(G3.rod-CATCH,130);x3.lineTo(G3.rod,ROD_TOP);x3.lineTo(G3.rod+CATCH,130);x3.stroke();\n  x3.setLineDash([]);\n  // paratonchi\n  x3.fillStyle=\"#9aa5bb\";x3.fillRect(G3.rod-3,ROD_TOP,6,GROUND-ROD_TOP);\n  x3.beginPath();x3.arc(G3.rod,ROD_TOP,4,0,7);x3.fill();\n  // chaqmoqlar\n  G3.bolts.forEach(b=>{\n    x3.strokeStyle=b.done?(b.caught?\"#17a673\":\"#e5484d\"):\"#ffd84d\";\n    x3.lineWidth=b.done?3:2;\n    x3.beginPath();\n    const ys=b.y;\n    for(let k=0;k<=8;k++){\n      const y=30+(ys-30)*k/8;\n      const x=b.x+(k===0||k===8?0:b.j[k]);\n      k===0?x3.moveTo(x,y):x3.lineTo(x,y);\n    }\n    x3.stroke();\n  });\n  x3.fillStyle=c;x3.font=\"14px system-ui\";x3.textAlign=\"left\";\n  x3.fillText(`Ball: ${G3.score}`,10,44);\n  x3.textAlign=\"right\";\n  x3.fillText(`Hayot: ${G3.lives}`,350,44);\n  if(!G3.run){\n    x3.textAlign=\"center\";x3.font=\"bold 16px system-ui\";x3.fillStyle=c;\n    x3.fillText(G3.over?\"O'yin tugadi. Qayta boshlash uchun bosing\":\"Boshlash uchun bosing\",180,150);\n  }\n  $(\"g3i\").textContent=G3.over?`O'yin tugadi. Ball: ${G3.score}`:\"Paratonchini chaqmoq tushadigan joyga siljiting\";\n}\nfunction stepG3(){\n  if(!G3.run)return;\n  G3.frame++;\n  if(G3.frame%70===1){\n    const j=[0];\n    for(let k=1;k<8;k++)j.push(Math.round(rnd(-9,9)));\n    G3.bolts.push({x:Math.round(rnd(30,330)),y:30,j,done:false,caught:false,fl:0});\n  }\n  G3.bolts.forEach(b=>{\n    if(!b.done)b.y+=4;\n    if(!b.done&&b.y>=GROUND){\n      b.done=true;b.y=GROUND;\n      b.caught=Math.abs(b.x-G3.rod)<CATCH;\n      b.fl=14;\n      if(b.caught)G3.score++;else G3.lives--;\n    }\n    if(b.done)b.fl--;\n  });\n  G3.bolts=G3.bolts.filter(b=>!b.done||b.fl>0);\n  if(G3.lives<=0){\n    G3.run=false;G3.over=true;\n    drawG3();\n    return;\n  }\n  drawG3();\n  requestAnimationFrame(stepG3);\n}\nfunction startG3(){\n  if(G3.over)resetG3();\n  if(!G3.run){G3.run=true;requestAnimationFrame(stepG3)}\n}\nc3.onpointerdown=e=>{\n  e.preventDefault();\n  const p=pos(c3,e);\n  G3.rod=Math.max(20,Math.min(340,p.x));\n  startG3();\n  drawG3();\n};\nc3.onpointermove=e=>{\n  const p=pos(c3,e);\n  G3.rod=Math.max(20,Math.min(340,p.x));\n  if(!G3.run)drawG3();\n};\nresetG3();\n\n/* ---------- 2-oʻyin: hodisa va qiymat ---------- */\nconst ITEMS=[\n  {q:\"Chaqmoqning kuchlanishi taxminan qancha?\",o:[\"10⁸ V\",\"10³ V\",\"10⁵ V\",\"10¹² V\"],a:0},\n  {q:\"Chaqmoq toki taxminan qancha?\",o:[\"30 kA\",\"30 A\",\"30 MA\",\"30 mA\"],a:0},\n  {q:\"Yer yuzasi yaqinidagi atmosfera elektr maydoni taxminan?\",o:[\"100 V/m\",\"1 V/m\",\"10 kV/m\",\"1 MV/m\"],a:0},\n  {q:\"Quruq havoning elektr mustahkamligi (buzilish maydoni) taxminan?\",o:[\"3·10⁶ V/m\",\"3·10³ V/m\",\"3 V/m\",\"3·10⁹ V/m\"],a:0},\n  {q:\"Nerv hujayrasining tinch holatdagi membrana potensiali taxminan?\",o:[\"−70 mV\",\"70 V\",\"−70 kV\",\"0,07 μV\"],a:0},\n  {q:\"Elektr ilonining elektr organi kuchlanishi taxminan?\",o:[\"600 V\",\"6 V\",\"60 mV\",\"6 MV\"],a:0},\n  {q:\"Bitta chaqmoqning energiyasi taxminan?\",o:[\"10⁹ J\",\"10³ J\",\"10⁵ W\",\"10¹² J\"],a:0},\n  {q:\"Chaqmoqning uzunligi taxminan?\",o:[\"5 km\",\"5 m\",\"500 m\",\"50 km\"],a:0}\n];\nlet G4={n:0,s:0,order:[],locked:false};\nfunction round4(){\n  G4.locked=false;\n  if(G4.n>=G4.order.length){\n    $(\"g4q\").textContent=`Natija: ${G4.s} / ${G4.order.length}`;\n    $(\"g4m\").textContent=G4.s>=7?\"🏆 Ajoyib!\":G4.s>=4?\"👍 Yaxshi\":\"📚 Qiymatlarni qayta eslang\";\n    $(\"g4o\").innerHTML=\"\";\n    const b=document.createElement(\"button\");b.className=\"btn\";b.textContent=\"Qayta oʻynash\";\n    b.onclick=startG4;$(\"g4o\").appendChild(b);\n    return;\n  }\n  const it=ITEMS[G4.order[G4.n]];\n  $(\"g4q\").textContent=`Savol ${G4.n+1}/${G4.order.length}: ${it.q}`;\n  $(\"g4m\").textContent=`Ball: ${G4.s}`;\n  const box=$(\"g4o\");box.innerHTML=\"\";\n  it.o.forEach((t,i)=>{\n    const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=t;\n    b.onclick=()=>{\n      if(G4.locked)return;G4.locked=true;\n      [...box.children][it.a].classList.add(\"right\");\n      if(i===it.a){G4.s++;$(\"g4m\").textContent=\"✅ Toʻgʻri!\"}\n      else{b.classList.add(\"bad\");$(\"g4m\").textContent=\"❌ Notoʻgʻri. Yashil javob toʻgʻri.\"}\n      G4.n++;\n      setTimeout(round4,1500);\n    };\n    box.appendChild(b);\n  });\n}\nfunction startG4(){\n  const order=ITEMS.map((_,i)=>i).sort(()=>Math.random()-.5);\n  G4={n:0,s:0,order,locked:false};\n  round4();\n}\n\n/* ---------- Test ---------- */\nconst T=[\n[\"Chaqmoq nima?\",[\"Bulutlar orasida yoki bulut bilan yer orasidagi katta elektr razryad\",\"Magnit maydon\",\"Yer qobig'ining harakati\",\"Suv bug'ining kondensatsiyasi\"],0],\n[\"Momaqaldiroq bulutida odatda qaysi qism musbat zaryadlanadi?\",[\"Yuqori qismi\",\"Pastki qismi\",\"Yon tomonlari\",\"Ikkalasi ham neytral\"],0],\n[\"Yer atmosferasining elektr maydoni yer yuzasi yaqinida qaysi yoʻnalishda?\",[\"Pastga (yerga tomon)\",\"Yuqoriga\",\"Gorizontal\",\"Nolga teng\"],0],\n[\"Quruq havoning elektr mustahkamligi taxminan qancha?\",[\"3·10⁶ V/m\",\"3·10³ V/m\",\"3 V/m\",\"3·10⁹ V/m\"],0],\n[\"Chaqmoq toki taxminan qancha?\",[\"30 kA\",\"30 A\",\"30 MA\",\"30 mA\"],0],\n[\"Chaqmoq kuchlanishi taxminan qancha?\",[\"10⁸ V\",\"10³ V\",\"10⁵ V\",\"10¹² V\"],0],\n[\"Paratonchi qanday ishlaydi?\",[\"Zaryadni yerga oqizib, binoni himoya qiladi\",\"Chaqmoqni bulutga qaytaradi\",\"Zaryadni yigʻib saqlaydi\",\"Magnit maydon hosil qiladi\"],0],\n[\"Nerv hujayrasining tinch holatdagi membrana potensiali taxminan?\",[\"−70 mV\",\"70 V\",\"−70 kV\",\"0,07 μV\"],0],\n[\"Elektr ilonining elektr organi taxminan qancha kuchlanish hosil qiladi?\",[\"600 V gacha\",\"6 V\",\"60 mV\",\"6 MV\"],0],\n[\"Sankt-Elmo olovi qaysi joylarda hosil boʻladi?\",[\"Uchli va baland joylarda\",\"Suv ostida\",\"Magnit qutblarida\",\"Yer qa'rida\"],0],\n[\"Shafaq (aurora) hosil boʻlishining asosiy sababi nima?\",[\"Quyosh shamolidagi zaryadlangan zarralarning Yer magnit maydonida harakati\",\"Chaqmoq\",\"Yerning ichki issiqligi\",\"Bulutlarning ishqalanishi\"],0],\n[\"Statik elektr qachon paydo boʻladi?\",[\"Ikki jism ishqalanib, zaryad almashinganda\",\"Jism qizdirilganda\",\"Jism sovitilganda\",\"Jismga magnit yaqinlashtirilganda\"],0],\n[\"Bitta chaqmoqning energiyasi taxminan qancha?\",[\"10⁹ J\",\"10³ J\",\"10⁶ W\",\"10¹² J\"],0],\n[\"Chaqmoq koʻrinib, ovoz keyin eshitilishining sababi nima?\",[\"Yorugʻlik tovushdan ancha tezroq tarqaladi\",\"Tovush tezroq tarqaladi\",\"Havo sovuq boʻladi\",\"Chaqmoq juda uzoqda boʻladi\"],0],\n[\"Chaqmoqdan keyin 3 s oʻtib momaqaldiroq eshitildi. Taxminiy masofa?\",[\"1 km\",\"100 m\",\"10 km\",\"30 km\"],0],\n[\"Balandlik ortganda yer atmosferasining elektr maydoni qanday oʻzgaradi?\",[\"Kamayadi\",\"Ortadi\",\"Oʻzgarmaydi\",\"Nolga teng boʻladi\"],0],\n[\"Havo ionlashuvi nima?\",[\"Havo molekulalaridan elektronlar ajralib, zaryadlangan zarralar hosil boʻlishi\",\"Havoning qizishi\",\"Havoning bugʻlanishi\",\"Havoning siqilishi\"],0],\n[\"Quyidagilardan qaysi biri elektr hodisa emas?\",[\"Kamalak hosil boʻlishi\",\"Chaqmoq\",\"Statik zaryad\",\"Nerv impulsi\"],0],\n[\"Taroq bilan tarangan sochlar tik turishining sababi nima?\",[\"Bir xil ishorali zaryadlarning itarishi\",\"Magnit tortishish\",\"Haroratning oshishi\",\"Og'irlik kuchi\"],0],\n[\"Yer va ionosfera orasida qanday elektr zanjiri mavjud?\",[\"Global elektr zanjiri\",\"Magnit zanjiri\",\"Faqat qisqa tutashuv\",\"Bunday zanjir yoʻq\"],0]\n];\nlet ti=0,ts=0,done=false;\nfunction tq(){\n  done=false;\n  if(ti>=20){\n    $(\"pb\").style.width=\"100%\";$(\"tn\").textContent=\"\";\n    $(\"tq\").textContent=`Natija: ${ts} / 20 (${ts*5}%)`;\n    $(\"to\").innerHTML=`<p>${ts>=18?\"🏆 Mukammal!\":ts>=14?\"👍 Juda yaxshi!\":ts>=10?\"🙂 Yaxshi, yana mashq qiling.\":\"📚 Nazariyani qayta oʻqib chiqing.\"}<\/p>`;\n    $(\"tx\").style.display=\"\";$(\"tx\").textContent=\"Qayta boshlash\";\n    return;\n  }\n  const q=T[ti];\n  $(\"tx\").style.display=\"none\";\n  $(\"pb\").style.width=(ti/20*100)+\"%\";\n  $(\"tn\").textContent=`Savol ${ti+1} / 20 · Toʻgʻri: ${ts}`;\n  $(\"tq\").textContent=q[0];\n  $(\"to\").innerHTML=\"\";\n  q[1].forEach((o,i)=>{\n    const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=o;\n    b.onclick=()=>{\n      if(done)return;done=true;\n      [...$(\"to\").children][q[2]].classList.add(\"right\");\n      if(i===q[2])ts++;else b.classList.add(\"bad\");\n      $(\"tx\").style.display=\"\";$(\"tx\").textContent=ti===19?\"Natijani koʻrish\":\"Keyingisi\";\n    };\n    $(\"to\").appendChild(b);\n  });\n}\n$(\"tx\").onclick=()=>{\n  if(ti>=20){ti=0;ts=0}else{ti++}\n  tq();\n};\n\n/* ---------- Ishga tushirish ---------- */\nshow(0);\ndrawSim1();\ndrawSim2();\nstartG4();\ntq();\n"}]</script>
<script>
(function () {
  var topics = JSON.parse(document.getElementById('topics').textContent);
  var desc = [
    'Ishqalanish, tegizish, influensiya',
    'Zaryadning xossalari, elementar zaryad',
    'Zaryadlarning oʻzaro taʼsiri: F = k·q₁q₂/r²',
    'Algoritm, kalkulyator, hisoblash',
    'Kuchlanganlik, maydon chiziqlari, kondensator',
    'Sirt zichligi, uchi effekti, ekranlash',
    'Chaqmoq, statik elektr, paratonchi'
  ];
  var toc = document.getElementById('toc');
  var list = document.getElementById('list');
  var app = document.getElementById('app');
  var back = document.getElementById('back');
  var styleEl = document.getElementById('topicStyle');

  function openTopic(i) {
    var t = topics[i];
    toc.style.display = 'none';
    back.style.display = 'block';
    styleEl.textContent = t.css;
    app.innerHTML = t.body;
    var s = document.createElement('script');
    s.textContent = '(function(){' + t.js + '\n})();';
    app.appendChild(s);
    window.scrollTo(0, 0);
  }

  function showToc() {
    app.innerHTML = '';
    styleEl.textContent = '';
    back.style.display = 'none';
    toc.style.display = 'block';
    window.scrollTo(0, 0);
  }

  topics.forEach(function (t, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'item';
    var n = document.createElement('div'); n.className = 'n'; n.textContent = i + 1;
    var box = document.createElement('div'); box.className = 't';
    var bt = document.createElement('b'); bt.textContent = t.title;
    var sp = document.createElement('span'); sp.textContent = desc[i] || '';
    box.appendChild(bt); box.appendChild(sp);
    var e = document.createElement('div'); e.className = 'e'; e.textContent = t.emoji;
    b.appendChild(n); b.appendChild(box); b.appendChild(e);
    b.onclick = function () { openTopic(i); };
    list.appendChild(b);
  });
  back.onclick = showToc;
})();
</script>
