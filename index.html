er:0;background:var(--ac);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;cursor:pointer}\n.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}\nselect,input[type=range]{font-size:15px}input[type=range]{width:100%}\nlabel{display:block;font-size:14px;color:var(--mu)}\n.out{font-weight:600}.mu{color:var(--mu);font-size:14px}\n.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}\n.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:var(--pos);color:#fff;border-color:var(--pos)}\n.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0}\n.big{display:flex;justify-content:center;gap:30px;margin:14px 0}\n.ball{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;font-weight:700}\n", "body": "\n<header><h1>⚡ Jismlarning zaryadlanishi<\/h1><p>Nazariya, simulyatsiya, oʻyin va test<\/p><\/header>\n<nav id=\"nav\"><\/nav>\n<main>\n\n<section id=\"s0\" class=\"on\">\n<div class=\"card\"><h3>1. Elektr zaryadi nima?<\/h3>\n<p>Elektr zaryadi — jismlarning elektromagnit oʻzaro taʼsirga kirishish qobiliyatini koʻrsatuvchi kattalik. Zaryad ikki xil boʻladi: <b style=\"color:var(--pos)\">musbat (+)<\/b> va <b style=\"color:var(--neg)\">manfiy (−)<\/b>. Birligi — kulon (C).<\/p><\/div>\n<div class=\"card\"><h3>2. Atom tuzilishi<\/h3>\n<p>Atom yadrosida musbat zaryadli <b>protonlar<\/b> va neytral <b>neytronlar<\/b> bor, yadro atrofida manfiy zaryadli <b>elektronlar<\/b> aylanadi. Neytral atomda protonlar soni elektronlar soniga teng.<\/p>\n<p>Elementar zaryad: <span class=\"f\">e = 1,6·10⁻¹⁹ C<\/span><\/p><\/div>\n<div class=\"card\"><h3>3. Jismlar qanday zaryadlanadi?<\/h3>\n<p><b>Ishqalanish:<\/b> ikki jism ishqalanganda elektronlar bir jismdan ikkinchisiga oʻtadi. Elektron yoʻqotgan jism musbat, ortiqcha elektron olgan jism manfiy zaryadlanadi. Masalan, shisha + ipak: shisha musbat, ipak manfiy; ebonit + jun: ebonit manfiy.<\/p>\n<p><b>Tegizish:<\/b> zaryadlangan jism neytral jismga tegsa, zaryad ikkalasiga taqsimlanadi.<\/p>\n<p><b>Influensiya (taʼsir):<\/b> zaryadlangan jism yaqinlashtirilganda neytral jismdagi zaryadlar qayta taqsimlanadi, jism tegmasdan ham tortiladi.<\/p><\/div>\n<div class=\"card\"><h3>4. Zaryadning saqlanish qonuni<\/h3>\n<p>Yopiq sistemada zaryadlarning algebraik yigʻindisi doimo oʻzgarmaydi: <span class=\"f\">q₁ + q₂ + … + qₙ = const<\/span><\/p><\/div>\n<div class=\"card\"><h3>5. Kulon qonuni<\/h3>\n<p>Ikki nuqtaviy zaryad orasidagi taʼsir kuchi zaryadlar koʻpaytmasiga toʻgʻri, ular orasidagi masofa kvadratiga teskari proporsional:<\/p>\n<p><span class=\"f\">F = k·|q₁·q₂| / r²<\/span>, &nbsp; k = 9·10⁹ N·m²/C²<\/p>\n<p>Bir xil ishorali zaryadlar <b>itariladi<\/b>, turli ishoralilar <b>tortiladi<\/b>.<\/p><\/div>\n<div class=\"card\"><h3>6. Oʻtkazgich va dielektrik<\/h3>\n<p><b>Oʻtkazgichlar<\/b> (metallar, tuzli suv) erkin zaryadlarga ega. <b>Dielektriklar<\/b> (shisha, ebonit, rezina, plastmassa) erkin zaryadlarga deyarli ega emas. Zaryad borligini <b>elektroskop<\/b> bilan aniqlash mumkin.<\/p><\/div>\n<\/section>\n\n<section id=\"s1\">\n<h2>🧪 1-simulyatsiya: Ishqalanish orqali zaryadlash<\/h2>\n<p class=\"mu\">Juftlikni tanlang, “Ishqalash” tugmasini bosing, soʻng tayoqchani qogʻoz boʻlaklariga yaqinlashtiring (barmoq yoki sichqoncha bilan suring).<\/p>\n<div class=\"row\"><select id=\"mat\"><option value=\"1\">Shisha tayoqcha + ipak<\/option><option value=\"-1\">Ebonit tayoqcha + jun<\/option><\/select>\n<button class=\"btn\" id=\"rub\">Ishqalash<\/button><button class=\"btn g\" id=\"rst\">Tiklash<\/button><\/div>\n<canvas id=\"c1\" width=\"360\" height=\"300\"><\/canvas>\n<p class=\"out\" id=\"i1\"><\/p>\n<\/section>\n\n<section id=\"s2\">\n<h2>🧪 2-simulyatsiya: Kulon qonuni<\/h2>\n<div class=\"card\">\n<label>q₁ = <span id=\"v1\"><\/span> μC<\/label><input type=\"range\" id=\"q1\" min=\"-10\" max=\"10\" step=\"1\" value=\"4\">\n<label>q₂ = <span id=\"v2\"><\/span> μC<\/label><input type=\"range\" id=\"q2\" min=\"-10\" max=\"10\" step=\"1\" value=\"-3\">\n<label>Masofa r = <span id=\"v3\"><\/span> sm<\/label><input type=\"range\" id=\"r\" min=\"5\" max=\"50\" step=\"1\" value=\"20\">\n<\/div>\n<canvas id=\"c2\" width=\"360\" height=\"150\"><\/canvas>\n<p class=\"out\" id=\"i2\"><\/p>\n<p class=\"mu\">Masofani 2 marta oshirib koʻring: kuch 4 marta kamayadi.<\/p>\n<\/section>\n\n<section id=\"s3\">\n<h2>🎮 1-oʻyin: Zaryad ovchisi<\/h2>\n<p class=\"mu\">Savatni suring va faqat <b>koʻrsatilgan ishorali<\/b> zarralarni tuting. Notoʻgʻri zarra — 1 jon yoʻqotasiz. Maqsad ham oʻzgarib turadi!<\/p>\n<div class=\"row\"><button class=\"btn\" id=\"g1s\">Boshlash<\/button><span class=\"out\" id=\"g1i\"><\/span><\/div>\n<canvas id=\"c3\" width=\"320\" height=\"400\"><\/canvas>\n<\/section>\n\n<section id=\"s4\">\n<h2>🎮 2-oʻyin: Tortadimi yoki itaradimi?<\/h2>\n<p class=\"mu\">10 ta savol. Ikki jism orasidagi taʼsirni toping. (0 — neytral jism.)<\/p>\n<div class=\"card\" style=\"text-align:center\">\n<div class=\"mu\" id=\"g2i\"><\/div>\n<div class=\"big\"><div class=\"ball\" id=\"b1\"><\/div><div class=\"ball\" id=\"b2\"><\/div><\/div>\n<div class=\"row\" style=\"justify-content:center\"><button class=\"btn\" id=\"a1\">Tortadi<\/button><button class=\"btn\" id=\"a2\" style=\"background:var(--pos)\">Itaradi<\/button><button class=\"btn g\" id=\"a3\">Taʼsir yoʻq<\/button><\/div>\n<p class=\"out\" id=\"g2m\"><\/p><\/div>\n<\/section>\n\n<section id=\"s5\">\n<h2>📝 Test (20 ta savol)<\/h2>\n<div class=\"card\"><div class=\"bar\"><i id=\"pb\"><\/i><\/div><p class=\"mu\" id=\"tn\"><\/p><h3 id=\"tq\"><\/h3><div id=\"to\"><\/div><div class=\"row\"><button class=\"btn\" id=\"tx\" style=\"display:none\">Keyingisi<\/button><\/div><\/div>\n<\/section>\n<\/main>\n\n", "js": "\nconst $=id=>document.getElementById(id);\nconst tabs=[\"📖 Nazariya\",\"🧪 Simulyatsiya 1\",\"🧪 Simulyatsiya 2\",\"🎮 Oʻyin 1\",\"🎮 Oʻyin 2\",\"📝 Test\"];\ntabs.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;b.onclick=()=>show(i);$(\"nav\").appendChild(b)});\nfunction show(n){document.querySelectorAll(\"section\").forEach((s,i)=>s.classList.toggle(\"on\",i==n));[...$(\"nav\").children].forEach((b,i)=>b.classList.toggle(\"on\",i==n));}\nshow(0);\nconst col=()=>getComputedStyle(document.body).color;\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nfunction pos(c,e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}}\n\n/* ---- Simulyatsiya 1 ---- */\nconst c1=$(\"c1\"),x1=c1.getContext(\"2d\");let rod={x:180,y:120},ch=0,sg=1,rubs=0,P=[];\nfunction mk(){P=[];for(let i=0;i<16;i++)P.push({x:rnd(40,320),y:285,vx:0,vy:0,rep:0})}mk();\nc1.onpointermove=e=>{rod=pos(c1,e)};c1.onpointerdown=c1.onpointermove;\n$(\"mat\").onchange=()=>{ch=0;rubs=0;sg=+$(\"mat\").value;mk()};\n$(\"rub\").onclick=()=>{sg=+$(\"mat\").value;ch=Math.min(100,ch+12);rubs++};\n$(\"rst\").onclick=()=>{ch=0;rubs=0;mk()};\nfunction loop1(){x1.clearRect(0,0,360,300);\n P.forEach(p=>{const dx=rod.x-p.x,dy=rod.y+12-p.y,d=Math.hypot(dx,dy)||1;\n  if(ch>0&&!p.rep){const f=Math.min(1.6,ch*60/(d*d+400));p.vx+=dx/d*f;p.vy+=dy/d*f}\n  p.vy+=.35;if(p.rep>0){p.rep--;p.vx-=dx/d*.4}\n  if(d<16&&ch>0&&!p.rep){p.rep=60;p.vy=-2}\n  p.vx*=.93;p.vy*=.93;p.x+=p.vx;p.y+=p.vy;\n  if(p.y>285){p.y=285;p.vy=0}p.x=Math.max(5,Math.min(355,p.x));\n  x1.fillStyle=\"#d9a441\";x1.fillRect(p.x-4,p.y-2,8,5)});\n x1.fillStyle=ch?(sg>0?\"#e5484d\":\"#2f7de1\"):\"#8a94a8\";x1.fillRect(rod.x-60,rod.y-5,120,12);\n x1.fillStyle=col();x1.font=\"14px system-ui\";x1.textAlign=\"center\";\n x1.fillText(ch?(sg>0?\"+ \".repeat(Math.ceil(ch/25)):\"− \".repeat(Math.ceil(ch/25))):\"neytral\",rod.x,rod.y-12);\n const n=rubs*Math.round(ch?1:0);\n $(\"i1\").innerHTML=ch?`${sg>0?\"Tayoqcha musbat zaryadlandi: u elektronlarini ipakka berdi.\":\"Tayoqcha manfiy zaryadlandi: u junidan elektronlar oldi.\"} <br>Zaryad darajasi: ${ch}%, ishqalashlar: ${rubs}`:\"Tayoqcha neytral — qogʻozlarni tortmaydi.\";\n requestAnimationFrame(loop1)}loop1();\n\n/* ---- Simulyatsiya 2 ---- */\nconst c2=$(\"c2\"),x2=c2.getContext(\"2d\");\nfunction sim2(){const q1=+$(\"q1\").value,q2=+$(\"q2\").value,r=+$(\"r\").value;\n $(\"v1\").textContent=q1;$(\"v2\").textContent=q2;$(\"v3\").textContent=r;\n const F=9e9*Math.abs(q1*q2)*1e-12/((r/100)**2);\n x2.clearRect(0,0,360,150);const xa=50,xb=50+r*5.8,y=75;\n const cc=q=>q>0?\"#e5484d\":q<0?\"#2f7de1\":\"#8a94a8\";\n [[xa,q1],[xb,q2]].forEach(([x,q])=>{x2.fillStyle=cc(q);x2.beginPath();x2.arc(x,y,16,0,7);x2.fill();x2.fillStyle=\"#fff\";x2.font=\"bold 20px system-ui\";x2.textAlign=\"center\";x2.fillText(q>0?\"+\":q<0?\"−\":\"0\",x,y+7)});\n const L=Math.min(60,10+Math.sqrt(F)*6),att=q1*q2<0;\n if(q1&&q2){x2.strokeStyle=col();x2.lineWidth=3;x2.beginPath();\n  const a=(x,dir)=>{x2.moveTo(x,y-28);x2.lineTo(x+dir*L,y-28);x2.moveTo(x+dir*L,y-28);x2.lineTo(x+dir*(L-8),y-34);x2.moveTo(x+dir*L,y-28);x2.lineTo(x+dir*(L-8),y-22)};\n  a(xa,att?1:-1);a(xb,att?-1:1);x2.stroke()}\n $(\"i2\").innerHTML=!q1||!q2?\"Zaryadlardan biri nolga teng — kuch yoʻq.\":`F = 9·10⁹·|${q1}·10⁻⁶ · ${q2}·10⁻⁶| / (${r/100})² = <b>${F<0.01?F.toExponential(2):F.toFixed(3)} N<\/b> (${att?\"tortishish\":\"itarishish\"})`}\n[\"q1\",\"q2\",\"r\"].forEach(i=>$(i).oninput=sim2);sim2();\n\n/* ---- 1-oʻyin ---- */\nconst c3=$(\"c3\"),x3=c3.getContext(\"2d\");\nlet g1={run:false,bx:160,items:[],score:0,lives:3,tg:1,t:0,n:0};\nc3.onpointermove=e=>{g1.bx=pos(c3,e).x};c3.onpointerdown=c3.onpointermove;\n$(\"g1s\").onclick=()=>{g1={run:true,bx:160,items:[],score:0,lives:3,tg:1,t:0,n:0};loop3()};\nfunction loop3(){const g=g1;if(!g.run)return;g.t++;\n if(g.t%34==0)g.items.push({x:rnd(20,300),y:-10,s:rnd(1.6,2.6)+ h3>\n<p>Elektron zaryadi <span class=\"f\">−e<\/span>, proton zaryadi <span class=\"f\">+e<\/span>, neytron zaryadsiz. Bunda <span class=\"f\">e = 1,6·10⁻¹⁹ C<\/span>.<\/p>\n<p>Masalan, 5·10¹⁸ ta elektron yoʻqotgan jism <b>+0,8 C<\/b> zaryad oladi.<\/p><\/div>\n<div class=\"card\"><h3>4. Kulon qonuni<\/h3>\n<p>Vakuumda ikki nuqtaviy zaryad orasidagi kuch: <span class=\"f\">F = k·|q₁·q₂| / r²<\/span>, &nbsp; k = 9·10⁹ N·m²/C²<\/p>\n<p>Bir xil ishorali zaryadlar <b>itariladi<\/b>, turli ishoralilar <b>tortiladi<\/b>.<\/p><\/div>\n<div class=\"card\"><h3>5. Elektr maydon kuchlanganligi<\/h3>\n<p>Maydon kuchlanganligi <span class=\"f\">E = F / q₀<\/span> (birligi N/C). Nuqtaviy zaryad maydoni: <span class=\"f\">E = k·q / r²<\/span><\/p>\n<p>Maydon chiziqlari <b>musbat<\/b> zaryaddan chiqadi, <b>manfiy<\/b> zaryadga kiradi. Bir necha zaryad maydoni vektor yigʻindisiga teng (superpozitsiya).<\/p><\/div>\n<div class=\"card\"><h3>6. Zaryadlarning qayta taqsimlanishi<\/h3>\n<p>Ikki oʻtkazgich sharni tegizganda ular bir xil potensialga keladi. Zaryad sharlar radiusiga proporsional taqsimlanadi: <span class=\"f\">q₁' / q₂' = r₁ / r₂<\/span><\/p>\n<p>Radiuslari teng sharlarda zaryad teng boʻlinadi.<\/p><\/div>\n<\/section>\n\n<section id=\"s1\">\n<h2>🧪 1-simulyatsiya: Ikki zaryad maydoni<\/h2>\n<p class=\"mu\">Zaryadlarni sliderlar bilan oʻzgartiring. Strelkalar maydon yoʻnalishini, rangi kuchlanganlikni bildiradi. Sichqoncha yoki barmoqni kanvas ustida harakatlantirib, nuqtadagi E ni koʻring.<\/p>\n<label>q₁ = <span id=\"sv1\"><\/span> μC<\/label><input type=\"range\" id=\"sq1\" min=\"-10\" max=\"10\" step=\"1\" value=\"5\">\n<label>q₂ = <span id=\"sv2\"><\/span> μC<\/label><input type=\"range\" id=\"sq2\" min=\"-10\" max=\"10\" step=\"1\" value=\"-5\">\n<canvas id=\"c1\" width=\"360\" height=\"300\"><\/canvas>\n<p class=\"out\" id=\"i1\"><\/p>\n<\/section>\n\n<section id=\"s2\">\n<h2>🧪 2-simulyatsiya: Zaryadlarning tegishi<\/h2>\n<p class=\"mu\">Ikki metall sharni tegizing. Radius va dastlabki zaryadlarni oʻzgartirib, yakuniy zaryadlarni koʻring.<\/p>\n<div class=\"card\">\n<label>1-shar radiusi r₁ = <span id=\"sr1v\"><\/span> sm<\/label><input type=\"range\" id=\"sr1\" min=\"1\" max=\"5\" step=\"1\" value=\"2\">\n<label>2-shar radiusi r₂ = <span id=\"sr2v\"><\/span> sm<\/label><input type=\"range\" id=\"sr2\" min=\"1\" max=\"5\" step=\"1\" value=\"4\">\n<label>1-shar zaryadi Q₁ = <span id=\"sQ1v\"><\/span> μC<\/label><input type=\"range\" id=\"sQ1\" min=\"-10\" max=\"10\" step=\"1\" value=\"6\">\n<label>2-shar zaryadi Q₂ = <span id=\"sQ2v\"><\/span> μC<\/label><input type=\"range\" id=\"sQ2\" min=\"-10\" max=\"10\" step=\"1\" value=\"-2\">\n<\/div>\n<canvas id=\"c2\" width=\"360\" height=\"270\"><\/canvas>\n<p class=\"out\" id=\"i2\"><\/p>\n<\/section>\n\n<section id=\"s3\">\n<h2>🎮 1-oʻyin: Nol maydon nuqtasi<\/h2>\n<p class=\"mu\">Ikki musbat zaryad orasida maydon kuchlanganligi nolga teng boʻlgan nuqtani toping va chiziq ustida bosing. Qanchalik aniq boʻlsa, shuncha koʻp ball. Jami 5 raund.<\/p>\n<div class=\"row\"><button class=\"btn\" id=\"g3s\">Boshlash<\/button><span class=\"out\" id=\"g3i\"><\/span><\/div>\n<canvas id=\"c3\" width=\"360\" height=\"200\"><\/canvas>\n<p class=\"out\" id=\"g3m\"><\/p>\n<\/section>\n\n<section id=\"s4\">\n<h2>🎮 2-oʻyin: Elektronlar hisobi<\/h2>\n<p class=\"mu\">Berilgan miqdordagi elektron yoʻqotgan jismning zaryadini toping. e = 1,6·10⁻¹⁹ C. Jami 10 savol.<\/p>\n<div class=\"card\">\n<p class=\"out\" id=\"g4q\"><\/p>\n<div id=\"g4o\"><\/div>\n<p class=\"out\" id=\"g4m\"><\/p>\n<\/div>\n<\/section>\n\n<section id=\"s5\">\n<h2>📝 Test (20 ta savol)<\/h2>\n<div class=\"card\"><div class=\"bar\"><i id=\"pb\"><\/i><\/div><p class=\"mu\" id=\"tn\"><\/p><h3 id=\"tq\"><\/h3><div id=\"to\"><\/div><div class=\"row\"><button class=\"btn\" id=\"tx\" style=\"display:none\">Keyingisi<\/button><\/div><\/div>\n<\/section>\n<\/main>\n\n", "js": "\nconst $=id=>document.getElementById(id);\nconst rnd=(a,b)=>a+Math.random()*(b-a);\nconst K=9e9;\nconst col=()=>getComputedStyle(document.body).color;\nconst SUP={\"-\":\"⁻\",\"0\":\"⁰\",\"1\":\"¹\",\"2\":\"²\",\"3\":\"³\",\"4\":\"⁴\",\"5\":\"⁵\",\"6\":\"⁶\",\"7\":\"⁷\",\"8\":\"⁸\",\"9\":\"⁹\"};\nconst sup=n=>String(n).split(\"\").map(c=>SUP[c]).join(\"\");\nfunction fmtE(x){if(x===0)return \"0\";const e=Math.floor(Math.log10(Math.abs(x)));const m=x/10**e;return m.toFixed(2).replace(\".\",\",\")+\"·10\"+sup(e)}\nfunction pos(c,e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}}\n\n/* ---------- Navigatsiya ---------- */\nconst tabs=[\"📖 Nazariya\",\"🧪 Simulyatsiya 1\",\"🧪 Simulyatsiya 2\",\"🎮 Oʻyin 1\",\"🎮 Oʻyin 2\",\"📝 Test\"];\nfunction show(n){\n  document.querySelectorAll(\"section\").forEach((s,i)=>s.classList.toggle(\"on\",i===n));\n  [...$(\"nav\").children].forEach((b,i)=>b.classList.toggle(\"on\",i===n));\n}\ntabs.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;b.onclick=()=>show(i);$(\"nav\").appendChild(b)});\n\n/* ---------- 1-simulyatsiya: maydon ---------- */\nconst c1=$(\"c1\"),x1=c1.getContext(\"2d\");\nconst P1={x:120,y:150},P2={x:240,y:150};\nlet hover=null;\nfunction fieldAt(x,y,list){\n  let ex=0,ey=0;\n  for(const c of list){\n    const dx=(x-c.x)/100,dy=(y-c.y)/100,r2=dx*dx+dy*dy;\n    if(r2<1e-8)continue;\n    const r=Math.sqrt(r2),E=K*c.q/r2;\n    ex+=E*dx/r;ey+=E*dy/r;\n  }\n  return{ex,ey};\n}\nfunction drawSim1(){\n  const q1=(+$(\"sq1\").value)*1e-6,q2=(+$(\"sq2\").value)*1e-6;\n  $(\"sv1\").textContent=$(\"sq1\").value;$(\"sv2\").textContent=$(\"sq2\").value;\n  const list=[{x:P1.x,y:P1.y,q:q1},{x:P2.x,y:P2.y,q:q2}];\n  x1.clearRect(0,0,360,300);\n  for(let gx=15;gx<360;gx+=30)for(let gy=15;gy<300;gy+=30){\n    const{ex,ey}=fieldAt(gx,gy,list),m=Math.hypot(ex,ey);\n    if(m===0)continue;\n    const t=Math.min(1,Math.max(0,(Math.log10(m)-3)/4));\n    const ux=ex/m,uy=ey/m,L=14;\n    x1.globalAlpha=0.25+0.75*t;\n    x1.strokeStyle=col();x1.fillStyle=col();x1.lineWidth=1.5;\n    const hx=gx+ux*L/2,hy=gy+uy*L/2;\n    x1.beginPath();x1.moveTo(gx-ux*L/2,gy-uy*L/2);x1.lineTo(hx,hy);x1.stroke();\n    x1.beginPath();x1.moveTo(hx,hy);x1.lineTo(hx-ux*5-uy*3,hy-uy*5+ux*3);x1.lineTo(hx-ux*5+uy*3,hy-uy*5-ux*3);x1.fill();\n  }\n  x1.globalAlpha=1;\n  [[P1,q1],[P2,q2]].forEach(([p,q])=>{\n    x1.fillStyle=q>0?\"#e5484d\":q<0?\"#2f7de1\":\"#8a94a8\";\n    x1.beginPath();x1.arc(p.x,p.y,14,0,7);x1.fill();\n    x1.fillStyle=\"#fff\";x1.font=\"bold 18px system-ui\";x1.textAlign=\"center\";\n    x1.fillText(q>0?\"+\":q<0?\"−\":\"0\",p.x,p.y+6);\n  });\n  if(hover){\n    const{ex,ey}=fieldAt(hover.x,hover.y,list),E=Math.hypot(ex,ey);\n    x1.fillStyle=\"#f5a524\";x1.beginPath();x1.arc(hover.x,hover.y,4,0,7);x1.fill();\n    $(\"i1\").innerHTML=`Nuqtadagi E = <b>${E===0?\"0\":fmtE(E)} N/C<\/b>`;\n  }else{\n    $(\"i1\").textContent=\"Kanvas ustida harakatlantirib, maydon kuchlanganligini koʻring.\";\n  }\n}\nfunction moveHover(e){hover=pos(c1,e);drawSim1()}\nc1.onpointermove=moveHover;c1.onpointerdown=moveHover;\nc1.onpointerleave=()=>{hover=null;drawSim1()};\n$(\"sq1\").oninput=drawSim1;$(\"sq2\").oninput=drawSim1;\n\n/* ---------- 2-simulyatsiya: tegish ---------- */\nconst c2=$(\"c2\"),x2=c2.getContext(\"2d\");\nfunction drawSim2(){\n  const r1=+$(\"sr1\").value,r2=+$(\"sr2\").value,Q1=+$(\"sQ1\").value,Q2=+$(\"sQ2\").value;\n  $(\"sr1v\").textContent=r1;$(\"sr2v\").textContent=r2;$(\"sQ1v\").textContent=Q1;$(\"sQ2v\").textContent=Q2;\n  const Q=Q1+Q2,n1=Q*r1/(r1+r2),n2=Q*r2/(r1+r2);\n  x2.clearRect(0,0,360,270);\n  const draw=(x,y,r,q)=>{\n    x2.fillStyle=q>0?\"#e5484d\":q<0?\"#2f7de1\":\"#8a94a8\";\n    x2.beginPath();x2.arc(x,y,r*9,0,7);x2.fill();\n    x2.fillStyle=col();x2.font=\"bold 14px system-ui\";x2.textAlign=\"center\";\n    x2.fillText(q.toFixed(2)+\" μC\",x,y+r*9+18);\n  };\n  x2.fillStyle=col();x2.font=\"bold 14px system-ui\";x2.textAlign=\"center\";\n  x2.fillText(\"Tegishdan oldin\",180,18);\n  x2.fillText(\"Tegishdan keyin\",180,140);\n  draw(90,65,r1,Q1);draw(270,65,r2,Q2);\n  draw(90,200,r1,n1);draw(270,200,r2,n2);\n  $(\"i2\").innerHTML=`Umumiy zaryad saqlanadi: Q = ${Q.toFixed(2)} μC<br>Tegishdan keyin: q₁ = <b>${n1.toFixed(2)} μC<\/b>, q₂ = <b>${n2.toFixed(2)} μC<\/b>`;\n}\n[\"sr1\",\"sr2\",\"sQ1\",\"sQ2\"].forEach(i=>$(i).oninput=drawSim2);\n\n/* ---------- 1-oʻyin: nol maydon nuqtasi ---------- */\nconst c3=$(\"c3\"),x3=c3.getContext(\"2d\");\nconst QS=[1,4,9,16];\nlet g3={round:0,score:0,target:0,qa:1,qb:4,active:false,last:null,timer:null};\nfunction draw3(){\n  x3.clearRect(0,0,360,200);\n  const A={x:40,y:100},B={x:320,y:100};\n  const ch=(p,q)=>{x3.fillStyle=\"#e5484d\";x3.beginPath();x3.arc(p.x,p.y,12+Math.min(q,9)*1.5,0,7);x3.fill();\n    x3.fillStyle=\"#fff\";x3.font=\"bold 16px system-ui\";x3.textAlign=\"center\";x3.fillText(\"+\",p.x,p.y+6)};\n  x3.strokeStyle=col();x3.lineWidth=1;x3.beginPath();x3.moveTo(40,100);x3.lineTo(320,100);x3.stroke();\n  ch(A,g3.qa);ch(B,g3.qb);\n  if(g3.last){\n    x3.setLineDash([5,4]);x3.strokeStyle=\"#17a673\";x3.beginPath();x3.moveTo(g3.target,30);x3.lineTo(g3.target,170);x3.stroke();x3.setLineDash([]);\n    x3.fillStyle=\"#17a673\";x3.beginPath();x3.arc(g3.target,100,5,0,7);x3.fill();\n    x3.fillStyle=\"#f5a524\";x3.beginPath();x3.arc(g3.last.x,100,6,0,7);x3.fill();\n  }\n  x3.fillStyle=col();x3.font=\"14px system-ui\";x3.textAlign=\"center\";\n  x3.fillText(`q₁ = ${g3.qa}, q₂ = ${g3.qb} (birlik)`,180,186);\n}\nfunction newRound3(){\n  let a,b;\n  do{a=QS[Math.floor(Math.random()*QS.length)];b=QS[Math.floor(Math.random()*QS.length)]}while(a===b);\n  g3.qa=a;g3.qb=b;\n  const sa=Math.sqrt(a),sb=Math.sqrt(b);\n  g3.target=(320*sa+40*sb)/(sa+sb);\n  g3.last=null;g3.active=true;\n  draw3();\n  $(\"g3i\").textContent=`Raund ${g3.round+1}/5 · Ball: ${g3.score}`;\n  $(\"g3m\").textContent=\"Nol maydon nuqtasini chiziq ustida bosing.\";\n}\nc3.onpointerdown=e=>{\n  if(!g3.active)return;\n  const p=pos(c3,e);\n  g3.last={x:p.x};g3.active=false;\n  const d=Math.abs(p.x-g3.target);\n  const pts=d<=8?3:d<=20?2:d<=40?1:0;\n  g3.score+=pts;g3.round++;\n  const msg=[\"Afsuski, juda uzoq.\",\"Yaxshi, lekin aniqroq boʻlsin.\",\"Yaxshi natija!\",\"A'lo, aniq topdingiz!\"][pts];\n  draw3();\n  $(\"g3i\").textContent=`Raund ${g3.round}/5 · Ball: ${g3.score}`;\n  if(g3.round<5){\n    $(\"g3m\").textContent=`${msg} (+${pts} ball). Keyingi raund…`;\n    g3.timer=setTimeout(newRound3,2000);\n  }else{\n    $(\"g3m\").innerHTML=`${msg} Oʻyin tugadi! Jami: <b>${g3.score} / 15<\/b> ball`;\n  }\n};\n$(\"g3s\").onclick=()=>{clearTimeout(g3.timer);g3.round=0;g3.score=0;newRound3()};\n\n/* ---------- 2-oʻyin: elektronlar hisobi ---------- */\nconst NS=[2,5,8,12,25,40];\nlet g4={n:0,s:0,locked:false};\nfunction round4(){\n  g4.locked=false;\n  if(g4.n>=10){\n    $(\"g4q\").textContent=`Natija: ${g4.s} / 10`;\n    $(\"g4m\").textContent=g4.s>=8?\"🏆 Ajoyib!\":g4.s>=5?\"👍 Yaxshi\":\"📚 Nazariyani qayta oʻqing\";\n    $(\"g4o\").innerHTML=\"\";\n    const b=document.createElement(\"button\");b.className=\"btn\";b.textContent=\"Qayta oʻynash\";\n    b.onclick=()=>{g4={n:0,s:0,locked:false};round4()};\n    $(\"g4o\").appendChild(b);\n    return;\n  }\n  const N=NS[Math.floor(Math.random()*NS.length)]*1e17;\n  const base=N*1.6e-19;\n  const dis=[base*10,base/10,base*2,base/2].sort(()=>Math.random()-.5).slice(0,3);\n  const opts=[{v:base,ok:true},...dis.map(v=>({v,ok:false}))].sort(()=>Math.random()-.5);\n  $(\"g4q\").textContent=`Savol ${g4.n+1}/10: ${fmtE(N)} ta elektron yoʻqotgan jismning zaryadi qancha?`;\n  $(\"g4m\").textContent=`Ball: ${g4.s}`;\n  $(\"g4o\").innerHTML=\"\";\n  opts.forEach(o=>{\n    const b=document.createElement(\"button\");b.className=\"opt\";\n    b.textContent=\"+\"+fmtE(o.v)+\" C\";b.dataset.ok=o.ok?\"1\":\"0\";\n    b.onclick=()=>{\n      if(g4.locked)return;g4.locked=true;\n      if(o.ok){g4.s++;b.classList.add(\"right\");$(\"g4m\"). ol maydon nuqtasi qayerda?\",[\"Zaryadlar orasida oʻrtada\",\"Chap zaryad yonida\",\"Oʻng zaryad yonida\",\"Cheksizlikda\"],0],\n[\"Radiuslari teng ikki metall shar +6 μC va −2 μC zaryadlar bilan tegizilib ajratildi. Har biri zaryadi?\",[\"+4 μC\",\"+2 μC\",\"−2 μC\",\"+8 μC\"],1],\n[\"Tegishdan keyin zaryad katta radiusli sharda qanday boʻladi?\",[\"Kamroq\",\"Koʻproq (radiusga proporsional)\",\"Teng taqsimlanadi\",\"Nolga teng boʻladi\"],1],\n[\"5·10¹⁸ ta elektron yoʻqotgan jismning zaryadi qancha?\",[\"−0,8 C\",\"+0,8 C\",\"+3,2 C\",\"−3,2 C\"],1],\n[\"Elektroskop bargi nima uchun ochiladi?\",[\"Bir xil ishorali zaryadlar itarilgani uchun\",\"Magnit taʼsiri tufayli\",\"Harorat oshgani uchun\",\"Ogʻirlik taʼsiri tufayli\"],0],\n[\"Musbat sinov zaryadiga taʼsir kuchi qaysi yoʻnalishda boʻladi?\",[\"Maydonga qarama-qarshi\",\"Maydon yoʻnalishi bilan bir xil\",\"Yoʻnalishi yoʻq\",\"Maydonga perpendikulyar\"],1],\n[\"q₁ = 4 μC va q₂ = 5 μC zaryadlar 0,2 m masofada turibdi. Kulon kuchi qancha? (k = 9·10⁹)\",[\"4,5 N\",\"45 N\",\"0,45 N\",\"0,0045 N\"],0]\n];\nlet ti=0,ts=0,done=false;\nfunction tq(){\n  done=false;\n  if(ti>=20){\n    $(\"pb\").style.width=\"100%\";$(\"tn\").textContent=\"\";\n    $(\"tq\").textContent=`Natija: ${ts} / 20 (${ts*5}%)`;\n    $(\"to\").innerHTML=`<p>${ts>=18?\"🏆 Mukammal!\":ts>=14?\"👍 Juda yaxshi!\":ts>=10?\"🙂 Yaxshi, yana mashq qiling.\":\"📚 Nazariyani qayta oʻqib chiqing.\"}<\/p>`;\n    $(\"tx\").style.display=\"\";$(\"tx\").textContent=\"Qayta boshlash\";\n    return;\n  }\n  const q=T[ti];\n  $(\"tx\").style.display=\"none\";\n  $(\"pb\").style.width=(ti/20*100)+\"%\";\n  $(\"tn\").textContent=`Savol ${ti+1} / 20 · Toʻgʻri: ${ts}`;\n  $(\"tq\").textContent=q[0];\n  $(\"to\").innerHTML=\"\";\n  q[1].forEach((o,i)=>{\n    const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=o;\n    b.onclick=()=>{\n      if(done)return;done=true;\n      [...$(\"to\").children][q[2]].classList.add(\"right\");\n      if(i===q[2])ts++;else b.classList.add(\"bad\");\n      $(\"tx\").style.display=\"\";$(\"tx\").textContent=ti===19?\"Natijani koʻrish\":\"Keyingisi\";\n    };\n    $(\"to\").appendChild(b);\n  });\n}\n$(\"tx\").onclick=()=>{\n  if(ti>=20){ti=0;ts=0}else{ti++}\n  tq();\n};\n\n/* ---------- Ishga tushirish ---------- */\nshow(0);\ndrawSim1();\ndrawSim2();\nnewRound3();\nround4();\ntq();\n"}, {"title": "Kulon qonuni", "emoji": "⚖️", "css": "\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fb;--card:#fff;--tx:#1c2333;--mu:#5b6578;--ac:#3b6cf6;--pos:#e5484d;--neg:#2f7de1;--ok:#17a673;--bd:#dde3ef}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;--bg:#0f1420;--card:#18202f;--tx:#e8ecf5;--mu:#9aa5bb;--ac:#6b93ff;--bd:#2a3550}}\n:root[data-theme=\"dark\"]{color-scheme:dark;--bg:#0f1420;--card:#18202f;--tx:#e8ecf5;--mu:#9aa5bb;--ac:#6b93ff;--bd:#2a3550}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader{padding:18px 16px 8px;max-width:760px;margin:auto}\nh1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--mu);font-size:14px}\nnav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:760px;margin:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}\nnav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:20px;font-size:14px;cursor:pointer}\nnav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}\nmain{max-width:760px;margin:auto;padding:8px 16px 40px}\nsection{display:none}section.on{display:block}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:10px 0}\nh2{font-size:19px;margin:6px 0}h3{font-size:16px;margin:0 0 6px}\n.card p{margin:6px 0}.f{font-weight:700;background:var(--bg);padding:8px 12px;border-radius:10px;display:inline-block}\ncanvas{width:100%;max-width:100%;border-radius:12px;background:var(--bg);border:1px solid var(--bd);touch-action:none;display:block;margin:8px 0}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}\n.btn{border:0;background:var(--ac);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;cursor:pointer}\n.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}\ninput[type=range]{width:100%}\nlabel{display:block;font-size:14px;color:var(--mu)}\n.out{font-weight:600}.mu{color:var(--mu);font-size:14px}\n.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}\n.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:var(--pos);color:#fff;border-color:var(--pos)}\n.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0}\n", "body": "\n<header><h1>⚖️ Kulon qonuni<\/h1><p>Zaryadlarning oʻzaro taʼsiri: nazariya, simulyatsiya, oʻyin va test<\/p><\/header>\n<nav id=\"nav\"><\/nav>\n<main>\n\n<section id=\"s0\" class=\"on\">\n<div class=\"card\"><h3>1. Kulon qonuni<\/h3>\n<p>Vakuumda ikki nuqtaviy zaryad orasidagi oʻzaro taʼsir kuchining moduli zaryadlar koʻpaytmasining moduliga toʻgʻri, ular orasidagi masofa kvadratiga teskari proporsional:<\/p>\n<p><span class=\"f\">F = k · |q₁·q₂| / r²<\/span><\/p>\n<p>Bu yerda <b>k = 9·10⁹ N·m²/C²<\/b>, <b>r<\/b> — zaryadlar orasidagi masofa (metrda), <b>q<\/b> — zaryadlar (kulonda).<\/p><\/div>\n<div class=\"card\"><h3>2. Kuchning yoʻnalishi<\/h3>\n<p>Kuch zaryadlarni tutashtiruvchi toʻgʻri chiziq boʻylab yoʻnalgan:<\/p>\n<p>• Bir xil ishorali zaryadlar — <b>itarishadi<\/b>.<br>• Turli ishorali zaryadlar — <b>tortishadi<\/b>.<\/p>\n<p>Ikki zaryad oʻzaro taʼsir kuchlari <b>teng modulli va qarama-qarshi yoʻnalgan<\/b> (Nyutonning 3-qonuni).<\/p><\/div>\n<div class=\"card\"><h3>3. Vektor koʻrinishi<\/h3>\n<p><span class=\"f\">F⃗₁₂ = k · q₁·q₂ / r² · r̂₁₂<\/span><\/p>\n<p>Bu yerda <b>r̂₁₂<\/b> — birlik vektor, q₁ dan q₂ ga qarab yoʻnalgan.<\/p><\/div>\n<div class=\"card\"><h3>4. Muhitning taʼsiri<\/h3>\n<p>Dielektrik muhitda kuch <b>ε<\/b> (dielektrik singdiruvchanlik) marta kamayadi:<\/p>\n<p><span class=\"f\">F = k · |q₁·q₂| / (ε · r²)<\/span><\/p>\n<p>Havo uchun ε ≈ 1, shuning uchun havoda kuch vakuumdagiga deyarli teng.<\/p><\/div>\n<div class=\"card\"><h3>5. Superpozitsiya prinsipi<\/h3>\n<p>Bir zaryadga bir nechta zaryad taʼsir qilsa, natijaviy kuch ularning <b>vektor yigʻindisiga<\/b> teng: <span class=\"f\">F⃗ = F⃗₁ + F⃗₂ + F⃗₃ + …<\/span><\/p><\/div>\n<div class=\"card\"><h3>6. Qoʻllanish sohasi<\/h3>\n<p>Kulon qonuni <b>nuqtaviy<\/b> va <b>qoʻzgʻalmas<\/b> zaryadlar uchun toʻgʻri keladi. Oʻlchamlari zaryadlar orasidagi masofaga nisbatan kichik boʻlgan jismlarni nuqtaviy deb qarash mumkin.<\/p>\n<p class=\"mu\">Kulon kuchi va Nyutonning gravitatsiya qonuni bir xil koʻrinishga ega: ikkalasi ham masofa kvadratiga teskari proporsional. Farqi — gravitatsiya faqat tortishadi, Kulon kuchi esa ham tortishadi, ham itaradi.<\/p><\/div>\n<\/section>\n\n<section id=\"s1\">\n<h2>🧪 1-simulyatsiya: F(r) bogʻlanish grafigi<\/h2>\n<p class=\"mu\">Zaryadlarni oʻzgartiring va kuchning masofaga bogʻliqligini koʻring. Egri chiziq <b>1/r²<\/b> qonuniga mos keladi. Qizil nuqta — tanlangan masofa.<\/p>\n<label>q₁ = <span id=\"av1\"><\/span> μC<\/label><input type=\"range\" id=\"aq1\" min=\"-10\" max=\"10\" step=\"1\" value=\"4\">\n<label>q₂ = <span id=\"av2\"><\/span> μC<\/label><input type=\"range\" id=\"aq2\" min=\"-10\" max=\"10\" step=\"1\" value=\"-3\">\n<label>Masofa r = <span id=\"avr\"><\/span> sm<\/label><input type=\"range\" id=\"ar\" min=\"5\" max=\"50\" step=\"1\" value=\"20\">\n<canvas id=\"c1\" width=\"360\" height=\"280\"><\/canvas>\n<p class=\"out\" id=\"i1\"><\/p>\n<p class=\"mu\">Masofani 2 marta oshirib koʻring: kuch 4 marta kamayadi.<\/p>\n<\/section>\n\n<section id=\"s2\">\n<h2>🧪 2-simulyatsiya: Superpozitsiya<\/h2>\n<p class=\"mu\">Uchta zaryad sinov zaryadiga (markaziy nuqta, +q₀) taʼsir qiladi. Har bir zaryadning kuchi koʻrsatilgan, natijaviy kuch esa sariq strelka bilan belgilangan. Zaryadlarni sliderlar bilan oʻzgartiring.<\/p>\n<label>Q_A = <span id=\"bq1v\"><\/span> μC<\/label><input type=\"range\" id=\"bq1\" min=\"-10\" max=\"10\" step=\"1\" value=\"6\">\n<label>Q_B = <span id=\"bq2v\"><\/span> μC<\/label><input type=\"range\" id=\"bq2\" min=\"-10\" max=\"10\" step=\"1\" value=\"-5\">\n<label>Q_C = <span id=\"bq3v\"><\/span> μC<\/label><input type=\"range\" id=\"bq3\" min=\"-10\" max=\"10\" step=\"1\" value=\"4\">\n<label>Sinov zaryadi q₀ = <span id=\"bq0v\"><\/span> μC<\/label><input type=\"range\" id=\"bq0\" min=\"1\" max=\"5\" step=\"1\" value=\"2\">\n<canvas id=\"c2\" width=\"360\" height=\"300\"><\/canvas>\n<p class=\"out\" id=\"i2\"><\/p>\n<\/section>\n\n<section id=\"s3\">\n<h2>🎮 1-oʻyin: Kuchni nishonga oling<\/h2>\n<p class=\"mu\">Zaryadlar qiymati berilgan. Masofani sliderda shunday tanlangki, kulon kuchi koʻrsatilgan maqsadga yaqin boʻlsin, soʻng “Tekshirish”ni bosing. Jami 5 raund.<\/p>\n<div class=\"row\"><button class=\"btn\" id=\"g1s\">Boshlash<\/button><span class=\"out\" id=\"g1i\"><\/span><\/div>\n<p class=\"out\" id=\"g1q\"><\/p>\n<label>Masofa r = <span id=\"g1rv\">50<\/span> sm<\/label><input type=\"range\" id=\"g1r\" min=\"10\" max=\"100\" step=\"1\" value=\"50\">\n<canvas id=\"c3\" width=\"360\" height=\"110\"><\/canvas>\n<div class=\"row\"><button class=\"btn\" id=\"g1c\">Tekshirish<\/button><\/div>\n<p class=\"out\" id=\"g1m\"><\/p>\n<\/section>\n\n<section id=\"s4\">\n<h2>🎮 2-oʻyin: Qaysi kuch katta?<\/h2>\n<p class=\"mu\">Ikki zaryad juftligi berilgan. Qaysi juftlikdagi kulon kuchi katta ekanini aniqlang. Jami 10 savol.<\/p>\n<div class=\"card\">\n<p class=\"out\" id=\"g2q\"><\/p>\n<div id=\"g2o\"><\/div>\n<p class=\"out\" id=\"g2m\"><\/p>\n<\/div>\n<\/section>\n\n<section id=\"s5\">\n<h2>📝 Test (20 ta savol)<\/h2>\n<div class=\"card\"><div class=\"bar\"><i id=\"pb\"><\/i><\/div><p class=\"mu\" id=\"tn\"><\/p><h3 id=\"tq\"><\/h3><div id=\"to\"><\/div><div class=\"row\"><button class=\"btn\" id=\"tx\" style=\"display:none\">Keyingisi<\/button><\/div><\/div>\n<\/section>\n<\/main>\n\n", "js": "\nconst $=id=>document.getElementById(id);\nconst K=9e9;\nconst col=()=>getComputedStyle(document.body).color;\nconst SUP={\"-\":\"⁻\",\"0\":\"⁰\",\"1\":\"¹\",\"2\":\"²\",\"3\":\"³\",\"4\":\"⁴\",\"5\":\"⁵\",\"6\":\"⁶\",\"7\":\"⁷\",\"8\":\"⁸\",\"9\":\"⁹\"};\nconst sup=n=>String(n).split(\"\").map(c=>SUP[c]).join(\"\");\nconst num=(x,d)=>x.toFixed(d).replace(\".\",\",\");\nfunction fmtF(F){\n  const a=Math.abs(F);\n  if(a===0)return \"0 N\";\n  if(a>=0.01)return num(a,3)+\" N\";\n  const e=Math.floor(Math.log10(a));\n  return num(a/10**e,2)+\"·10\"+(e<0?\"⁻\":\"\")+sup(Math.abs(e))+\" N\";\n}\n// Signed Kulon kuchi (N). q1,q2 — μC, r — sm, eps — muhit\nfunction coul(q1,q2,r,eps=1){return K*q1*q2*1e-12/((r/100)**2)/eps}\nfunction pos(c,e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}}\n\n/* ---------- Navigatsiya ---------- */\nconst tabs=[\"📖 Nazariya\",\"🧪 Simulyatsiya 1\",\"🧪 Simulyatsiya 2\",\"🎮 Oʻyin 1\",\"🎮 Oʻyin 2\",\"📝 Test\"];\nfunction show(n){\n  document.querySelectorAll(\"section\").forEach((s,i)=>s.classList.toggle(\"on\",i===n));\n  [...$(\"nav\").children].forEach((b,i)=>b.classList.toggle(\"on\",i===n));\n}\ntabs.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;b.onclick=()=>show(i);$(\"nav\").appendChild(b)});\n\n/* ---------- 1-simulyatsiya: F(r) grafigi ---------- */\nconst c1=$(\"c1\"),x1=c1.getContext(\"2d\");\nconst PL=45,PR=345,PT=20,PB=245;\nfunction drawSim1(){\n  const q1=+$(\"aq1\").value,q2=+$(\"aq2\").value,r=+$(\"ar\").value;\n  $(\"av1\").textContent=q1;$(\"av2\").textContent=q2;$(\"avr\").textContent=r;\n  const Fmax=Math.max(Math.abs(coul(q1,q2,5)),1e-9);\n  x1.clearRect(0,0,360,280);\n  const c=col();\n  x1.strokeStyle=c;x1.fillStyle=c;x1.lineWidth=1.5;\n  x1.beginPath();x1.moveTo(PL,PT);x1.lineTo(PL,PB);x1.lineTo(PR,PB);x1.stroke();\n  x1.font=\"12px system-ui\";x1.textAlign=\"center\";\n  x1.fillText(\"r (sm)\",(PL+PR)/2,272);\n  x1.fillText(\"5\",PL,PB+14);x1.fillText(\"50\",PR,PB+14);\n  x1.textAlign=\"right\";x1.fillText(num(Fmax,2)+\" N\",PL-4,PT+8);\n  x1.save();x1.translate(12,(PT+PB)/2);x1.rotate(-Math.PI/2);x1.textAlign=\"center\";x1.fillText(\"|F| (N)\",0,0);x1.restore();\n  // egri chiziq\n  x1.strokeStyle=\"#3b6cf6\";x1.lineWidth=2.5;x1.beginPath();\n  for(let rr=5;rr<=50;rr++){\n    const F=Math.abs(coul(q1,q2,rr));\n    const px=PL+(rr-5)/45*(PR-PL),py=PB-Math.min(1,F/Fmax)*(PB-PT);\n    rr===5?x1.moveTo(px,py):x1.lineTo(px,py);\n  }\n  x1.stroke();\n  // tanlangan nuqta\n  const F=coul(q1,q2,r),Fa=Math.abs(F);\n  const mx=PL+(r-5)/45*(PR-PL),my=PB-Math.min(1,Fa/Fmax)*(PB-PT);\n  x1.fillStyle=\"#e5484d\";x1.beginPath();x1.arc(mx,my,6,0,7);x1.fill();\n  let txt;\n  if(q1===0||q2===0)txt=\"Zaryadlardan biri nolga teng — kuch yoʻq.\";\n  else txt=`${q1*q2>0?\"Itarish\":\"Tortishish\"} kuchi: <b>${fmtF(F)}<\/b><br>F = k·|${q1}·${q2}| μC² / (${num(r/100,2)} m)² (1/r² ga teskari)`;\n  $(\"i1\").innerHTML=txt;\n}\n[\"aq1\",\"aq2\",\"ar\"].forEach(i=>$(i).oninput=drawSim1);\n\n/* ---------- 2-simulyatsiya: superpozitsiya ---------- */\nconst c2=$(\"c2\"),x2=c2.getContext(\"2d\");\nconst SRC=[{x:80,y:70,id:\"bq1\"},{x:280,y:70,id:\"bq2\"},{x:180,y:225,id:\"bq3\"}];\nconst TEST={x:180,y:145};\nfunction vec(fx,fy,scale){\n  const m=Math.hypot(fx,fy);if(m===0)return[0,0];\n  const L=Math.min(100,m*scale);return[fx/m*L,fy/m*L];\n}\nfunction arrow(x,y,dx,dy,color,w){\n  const L=Math.hypot(dx,dy);if(L<2)return;\n  const ux=dx/L,uy=dy/L;\n  x2.strokeStyle=color;x2.fillStyle=color;x2.lineWidth=w;\n  x2.beginPath();x2.moveTo(x,y);x2.lineTo(x+dx,y+dy);x2.stroke();\n  const hx=x+dx,hy=y+dy;\n  x2.beginPath();x2.moveTo(hx,hy);x2.lineTo(hx-ux*10-uy*5,hy-uy*10+ux*5);x2.lineTo(hx-ux*10+uy*5,hy-uy*10-ux*5);x2.fill();\n}\nfunction drawSim2(){\n  const qs=SRC.map(s=>+$(s.id).value),q0=+$(\"bq0\").value;\n  $(\"bq1v\").textContent=qs[0];$(\"bq2v\").textContent=qs[1];$(\"bq3v\").textContent=qs[2];$(\"bq0v\").textContent=q0;\n  x2.clearRect(0,0,360,300);\n  let Fx=0,Fy=0;\n  const parts=[];\n  SRC.forEach((s,i)=>{\n    const dx=TEST.x-s.x,dy=TEST.y-s.y,dist=Math.hypot(dx,dy);\n    const rm=dist/100;\n    const F=coul(qs[i],q0,rm*100);\n    const ux=dx/dist,uy=dy/dist;\n    const fx=F*ux,fy=F*uy;\n    Fx+=fx;Fy+=fy;\n    parts.push({fx,fy,i});\n  });\n  // komponentalar\n  parts.forEach(p=>{\n    const[vx,vy]=vec(p.fx,p.fy,900);\n    arrow(TEST.x,TEST.y,vx,vy,qs[p.i]>0?\"#e5484d\":qs[p.i]<0?\"#2f7de1\":\"#8a94a8\",2);\n  });\n  // natijaviy kuch\n  const[nx,ny]=vec(Fx,Fy,900);\n  arrow(TEST.x,TEST.y,nx,ny,\"#f5a524\",4);\n  // zaryadlar\n  SRC.forEach((s,i)=>{\n    const q=qs[i];\n    x2.fillStyle=q>0?\"#e5484d\":q<0?\"#2f7de1\":\"#8a94a8\";\n    x2.beginPath();x2.arc(s.x,s.y,14,0,7);x2.fill();\n    x2.fillStyle=\"#fff\";x2.font=\"bold 16px system-ui\";x2.textAlign=\"center\";\n    x2.fillText(q>0?\"+\":q<0?\"−\":\"0\",s.x,s.y+6);\n    x2.fillStyle=col();x2.font=\"12px system-ui\";\n    x2.fillText([\"A\",\"B\",\"C\"][i]+\" (\"+q+\" μC)\",s.x,s.y-20);\n  });\n  // sinov zaryadi\n  x2.fillStyle=col();x2.beginPath();x2.arc(TEST.x,TEST.y,5,0,7);x2.fill();\n  const Fm=Math.hypot(Fx,Fy);\n  $(\"i2\").innerHTML=`Natijaviy kuch: <b>${fmtF(Fm)}<\/b><br><span class=\"mu\">Sariq strelka — natijaviy kuch; rangli strelkalar — har bir zaryadning alohida kuchi.<\/span>`;\n}\n[\"bq1\",\"bq2\",\"bq3\",\"bq0\"].forEach(i=>$(i).oninput=drawSim2);\n\n/* ---------- 1-oʻyin: kuchni nishonga oling ---------- */\nconst c3=$(\"c3\"),x3=c3.getContext(\"2d\");\nlet G1={round:0,score:0,q1:1,q2:1,r0:50,target:0,locked:false,timer:null};\nfunction draw3(){\n  const r=+$(\"g1r\").value;\n  $(\"g1rv\").textContent=r;\n  x3.clearRect(0,0,360,110);\n  const gap=r*1.5,cx=180,y=50;\n  x3.fillStyle=\"#e5484d\";\n  [cx-gap/2,cx+gap/2].forEach(x=>{x3.beginPath();x3.arc(x,y,16,0,7);x3.fill()});\n  x3.fillStyle=\"#fff\";x3.font=\"bold 18px system-ui\";x3.textAlign=\"center\";\n  [cx-gap/2,cx+gap/2].forEach(x=>x3.fillText(\"+\",x,y+6));\n  x3.strokeStyle=col();x3.setLineDash([4,4]);x3.beginPath();x3.moveTo(cx-gap/2,y);x3.lineTo(cx+gap/2,y);x3.stroke();x3.setLineDash([]);\n  x3.fillStyle=col();x3.font=\"13px system-ui\";\n  x3.fillText(`r = ${r} sm`,cx,90);\n}\nfunction newRound1(){\n  G1.q1=1+Math.floor(Math.random()*9);\n  G1.q2=1+Math.floor(Math.random()*9);\n  G1.r0=10+Math.floor(Math.random()*80);\n  G1.target=coul(G1.q1,G1.q2,G1.r0);\n  G1.locked=false;\n  $(\"g1r\").value=50;\n  $(\"g1q\").textContent=`Raund ${G1.round+1}/5 · q₁ = ${G1.q1} μC, q₂ = ${G1.q2} μC · Maqsad: ${fmtF(G1.target)}`;\n  $(\"g1m\").textContent=\"Masofani sozlang va “Tekshirish”ni bosing.\";\n  $(\"g1i\").textContent=`Ball: ${G1.score}`;\n  $(\"g1c\").style.display=\"\";\n  draw3();\n}\n$(\"g1r\").oninput=draw3;\n$(\"g1c\").onclick=()=>{\n  if(G1.locked)return;G1.locked=true;\n  const r=+$(\"g1r\").value;\n  const F=coul(G1.q1,G1.q2,r);\n  const err=Math.abs(Math.abs(F)-Math.abs(G1.target))/Math.abs(G1.target);\n  const pts=err<=0.1?3:err<=0.25?2:err<=0.5?1:0;\n  G1.score+=pts;G1.round++;\n  const msg=[\"Juda uzoq.\",\"Yaxshi, lekin aniqroq.\",\"Yaxshi natija!\",\"A'lo, aniq topdingiz!\"][pts];\n  $(\"g1m\").innerHTML=`${msg} Sizda: ${fmtF(F)}, maqsad: ${fmtF(G1.target)} (r₀ = ${G1.r0} sm). +${pts} ball`;\n  $(\"g1i\").textContent=`Ball: ${G1.score}`;\n  $(\"g1c\").style.display=\"none\";\n  if(G1.round<5){\n    clearTimeout(G1.timer);\n    G1.timer=setTimeout(newRound1,2800);\n  }else{\n    $(\"g1q\").textContent=\"Oʻyin tugadi!\";\n    $(\"g1m\").innerHTML+=`<br>Jami: <b>${G1.score} / 15<\/b> ball`;\n  }\n};\n$(\"g1s\").onclick=()=>{clearTimeout(G1.timer);G1.round=0;G1.score=0;newRound1()};\n\n/* ---------- 2-oʻyin: qaysi kuch katta ---------- */\nlet G2={n:0,s:0,locked:false};\nfunction round2(){\n  G2.locked=false;\n  if(G2.n>=10){\n    $(\"g2q\").textContent=`Natija: ${G2.s} / 10`;\n    $(\"g2m\").textContent=G2.s>=8?\"🏆 Ajoyib!\":G2.s>=5?\"👍 Yaxshi\":\"📚 Nazariyani qayta oʻqing\";\n    $(\"g2o\").innerHTML=\"\";\n    const b=document.createElement(\"button\");b.className=\"btn\";b.textContent=\"Qayta oʻynash\";\n    b.onclick=()=>{G2={n:0,s:0,locked:false};round2()};\n    $(\"g2o\").appendChild(b);\n    return;\n  }\n  const rnd=n=>1+Math.floor(Math.random()*n);\n  const a={q1:rnd(9),q2:rnd(9),r:10*rnd(5)};\n  const b={q1:rnd(9),q2:rnd(9),r:10*rnd(5)};\n  const Fa=Math.abs(coul(a.q1,a.q2,a.r)),Fb=Math.abs(coul(b.q1,b.q2,b.r));\n  const ans=Math.abs(Fa-Fb)<1e-12?2:(Fa>Fb?0:1);\n  $(\"g2q\").textContent=`Savol ${G2.n+1}/10 · Ball: ${G2.s}`;\n  $(\"g2m\").innerHTML=\n    `1-juftlik: q₁ = ${a.q1} μC, q₂ = ${a.q2} μC, r = ${a.r} sm<br>2-juftlik: q₁ = ${b.q1} μC, q₂ = ${b.q2} μC, r = ${b.r} sm`;\n  $(\"g2o\").innerHTML=\"\";\n  [\"1-juftlikdagi kuch katta\",\"2-juftlikdagi kuch katta\",\"Kuchlar teng\"].forEach((t,i)=>{\n    const btn=document.createElement(\"button\");btn.className=\"opt\";btn.textContent=t;\n    btn.onclick=()=>{\n      if(G2.locked)return;G2.locked=true;\n      const bs=[...$(\"g2o\").children];\n      bs[ans].classList.add(\"right\");\n      let info=`1-juftlik kuchi: ${fmtF(Fa)}, 2-juftlik kuchi: ${fmtF(Fb)}.`;\n      if(i===ans){G2.s++;info=\"✅ Toʻgʻri! \"+info}else{btn.classList.add(\"bad\");info=\"❌ Notoʻgʻri. \"+info}\n      $(\"g2m\").innerHTML=info;\n      G2.n++;\n      setTimeout(round2,2000);\n    };\n    $(\"g2o\").appendChild(btn);\n  });\n}\n\n/* ---------- Test ---------- */\nconst T=[\n[\"Vakuumda ikki nuqtaviy zaryad orasidagi kulon kuchi qaysi formula bilan topiladi?\",[\"F = k·q₁·q₂ / r²\",\"F = m·a\",\"F = q·E\",\"F = k·q / r\"],0],\n[\"q₁ = q₂ = 1 μC, r = 1 m boʻlsa, kulon kuchi taxminan qancha?\",[\"0,009 N\",\"9 N\",\"0,9 N\",\"90 N\"],0],\n[\"Zaryadlar orasidagi masofa 2 marta kamaytirilsa, kuch qanday oʻzgaradi?\",[\"2 marta ortadi\",\"4 marta ortadi\",\"2 marta kamayadi\",\"Oʻzgarmaydi\"],1],\n[\"Ikkala zaryad ham 2 marta kamaytirilsa, kuch qanday oʻzgaradi?\",[\"2 marta kamayadi\",\"4 marta kamayadi\",\"8 marta kamayadi\",\"Oʻzgarmaydi\"],1],\n[\"Dielektrik singdiruvchanligi ε = 4 boʻlgan muhitda kuch qanday oʻzgaradi?\",[\"4 marta ortadi\",\"4 marta kamayadi\",\"2 marta kamayadi\",\"Oʻzgarmaydi\"],1],\n[\"Kulon qonuni qanday zaryadlar uchun toʻgʻri keladi?\",[\"Istalgan jismlar uchun\",\"Nuqtaviy va qoʻzgʻalmas zaryadlar uchun\",\"Faqat magnit maydonda\",\"Faqat musbat zaryadlar uchun\"],1],\n[\"Ikki zaryad orasidagi oʻzaro taʼsir kuchlari qanday yoʻnalgan?\",[\"Teng modulli va qarama-qarshi yoʻnalgan\",\"Bir xil yoʻnalgan\",\"Har xil modulli\",\"Ikkalasi ham nolga teng\"],0],\n[\"Kulon konstantasi k ning taxminiy qiymati qanday?\",[\"9·10⁹ N·m²/C²\",\"8,85·10⁻¹² N·m²/C²\",\"6,67·10⁻¹¹ N·m²/kg²\",\"1,6·10⁻¹⁹ C\"],0],\n[\"Zaryadlar bir xil ishorali boʻlsa, ular qanday taʼsirlashadi?\",[\"Tortishadi\",\"Itarishadi\",\"Taʼsirlashmaydi\",\"Avval tortishib, keyin itarishadi\"],1],\n[\"Zaryadlar turli ishorali boʻlsa, ular qanday taʼsirlashadi?\",[\"Tortishadi\",\"Itarishadi\",\"Taʼsirlashmaydi\",\"Aylanib yuradi\"],0],\n[\"Kulon kuchi qaysi toʻgʻri chiziq boʻylab yoʻnalgan?\",[\"Zaryadlarni tutashtiruvchi chiziq boʻylab\",\"Perpendikulyar\",\"Aylana boʻylab\",\"Yoʻnalishi yoʻq\"],0],\n[\"q₁ = 2 μC, q₂ = 3 μC, r = 0,3 m. Kulon kuchi qancha?\",[\"0,6 N\",\"6 N\",\"0,06 N\",\"60 N\"],0],\n[\"q₁ = 2 μC, q₂ = 3 μC, r = 0,1 m. Kulon kuchi qancha?\",[\"0,54 N\",\"5,4 N\",\"54 N\",\"0,054 N\"],1],\n[\"q₁ = q₂ = 1 μC, kuch 0,9 N. Zaryadlar orasidagi masofa qancha?\",[\"1 m\",\"0,1 m\",\"0,01 m\",\"10 m\"],1],\n[\"Bir zaryadga bir nechta zaryad taʼsir qilsa, natijaviy kuch qanday topiladi?\",[\"Skalyar yigʻindi sifatida\",\"Vektor yigʻindisi sifatida (superpozitsiya)\",\"Koʻpaytma sifatida\",\"Eng katta kuch sifatida\"],1],\n[\"Vakuumda ikki zaryad orasidagi kuch 8 N. Dielektrikda (ε = 2) kuch qancha boʻladi?\",[\"4 N\",\"16 N\",\"2 N\",\"8 N\"],0],\n[\"Kulon qonuni va Nyutonning gravitatsiya qonuni qaysi jihatdan oʻxshash?\",[\"Ikkalasi ham masofa kvadratiga teskari proporsional\",\"Ikkalasi ham masofaga toʻgʻri proporsional\",\"Ikkalasi ham faqat itaradi\",\"Ikkalasi ham faqat ishqalanishda ishlaydi\"],0],\n[\"Kulon kuchi zaryadlarga qanday bogʻliq?\",[\"Zaryadlar koʻpaytmasiga toʻgʻri proporsional\",\"Zaryadlar yigʻindisiga toʻgʻri proporsional\",\"Zaryadlar ayirmasiga toʻgʻri proporsional\",\"Zaryadlardan mustaqil\"],0],\n[\"q₁ = 2 μC va q₂ = 4 μC zaryadlar 0,2 m masofada turibdi. Kulon kuchi qancha?\",[\"1,8 N\",\"18 N\",\"0,18 N\",\"0,018 N\"],0],\n[\"Kulon kuchini tajribada oʻlchash uchun qaysi asbob ishlatilgan?\",[\"Burama tarozi\",\"Termometr\",\"Ampermetr\",\"Barometr\"],0],\n[\"Zaryadlar orasidagi masofa 1 m dan 10 m ga oshirilsa, kulon kuchi qanday oʻzgaradi?\",[\"10 marta kamayadi\",\"100 marta kamayadi\",\"10 marta ortadi\",\"Oʻzgarmaydi\"],1]\n];\nlet ti=0,ts=0,done=false;\nfunction tq(){\n  done=false;\n  if(ti>=20){\n    $(\"pb\").style.width=\"100%\";$(\"tn\").textContent=\"\";\n    $(\"tq\").textContent=`Natija: ${ts} / 20 (${ts*5}%)`;\n    $(\"to\").innerHTML=`<p>${ts>=18?\"🏆 Mukammal!\":ts>=14?\"👍 Juda yaxshi!\":ts>=10?\"🙂 Yaxshi, yana mashq qiling.\":\"📚 Nazariyani qayta oʻqib chiqing.\"}<\/p>`;\n    $(\"tx\").style.display=\"\";$(\"tx\").textContent=\"Qayta boshlash\";\n    return;\n  }\n  const q=T[ti];\n  $(\"tx\").style.display=\"none\";\n  $(\"pb\").style.width=(ti/20*100)+\"%\";\n  $(\"tn\").textContent=`Savol ${ti+1} / 20 · Toʻgʻri: ${ts}`;\n  $(\"tq\").textContent=q[0];\n  $(\"to\").innerHTML=\"\";\n  q[1].forEach((o,i)=>{\n    const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=o;\n    b.onclick=()=>{\n      if(done)return;done=true;\n      [...$(\"to\").children][q[2]].classList.add(\"right\");\n      if(i===q[2])ts++;else b.classList.add(\"bad\");\n      $(\"tx\").style.display=\"\";$(\"tx\").textContent=ti===19?\"Natijani koʻrish\":\"Keyingisi\";\n    };\n    $(\"to\").appendChild(b);\n  });\n}\n$(\"tx\").onclick=()=>{\n  if(ti>=20){ti=0;ts=0}else{ti++}\n  tq();\n};\n\n/* ---------- Ishga tushirish ---------- */\nshow(0);\ndrawSim1();\ndrawSim2();\nnewRound1();\nround2();\ntq();\n"}, {"title": "Masalalar yechish", "emoji": "🧮", "css": "\n:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f5f7fb;--card:#fff;--tx:#1c2333;--mu:#5b6578;--ac:#3b6cf6;--pos:#e5484d;--neg:#2f7de1;--ok:#17a673;--bd:#dde3ef}\nhtml{scroll-padding-top:env(safe-area-inset-top,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){color-scheme:dark;--bg:#0f1420;--card:#18202f;--tx:#e8ecf5;--mu:#9aa5bb;--ac:#6b93ff;--bd:#2a3550}}\n:root[data-theme=\"dark\"]{color-scheme:dark;--bg:#0f1420;--card:#18202f;--tx:#e8ecf5;--mu:#9aa5bb;--ac:#6b93ff;--bd:#2a3550}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,\"Segoe UI\",Roboto,sans-serif}\nheader{padding:18px 16px 8px;max-width:760px;margin:auto}\nh1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--mu);font-size:14px}\nnav{display:flex;gap:6px;overflow-x:auto;padding:8px 16px;max-width:760px;margin:auto;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}\nnav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 13px;border-radius:20px;font-size:14px;cursor:pointer}\nnav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}\nmain{max-width:760px;margin:auto;padding:8px 16px 40px}\nsection{display:none}section.on{display:block}\n.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin:10px 0}\nh2{font-size:19px;margin:6px 0}h3{font-size:16px;margin:0 0 6px}\n.card p{margin:6px 0}.f{font-weight:700;background:var(--bg);padding:8px 12px;border-radius:10px;display:inline-block}\ncanvas{width:100%;max-width:100%;border-radius:12px;background:var(--bg);border:1px solid var(--bd);touch-action:none;display:block;margin:8px 0}\n.row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}\n.btn{border:0;background:var(--ac);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;cursor:pointer}\n.btn:disabled{opacity:.5;cursor:default}\n.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}\nselect{font-size:15px;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);max-width:100%}\ninput[type=range]{width:100%}\nlabel{display:block;font-size:14px;color:var(--mu)}\n.out{font-weight:600}.mu{color:var(--mu);font-size:14px}\n.steps{font-size:15px;line-height:1.7;background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:8px}\n.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 13px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:15px;cursor:pointer}\n.opt.right{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.bad{background:var(--pos);color:#fff;border-color:var(--pos)}\n.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0}\n", "body": "\n<header><h1>🧮 Masalalar yechish<\/h1><p>Yechish algoritmi, kalkulyator, muvozanat, oʻyin va masala testi<\/p><\/header>\n<nav id=\"nav\"><\/nav>\n<main>\n\n<section id=\"s0\" class=\"on\">\n<div class=\"card\"><h3>1. Masala yechish algoritmi<\/h3>\n<p>Elektrostatika masalalarini quyidagi tartibda yeching:<\/p>\n<p>① <b>Berilgan va topish kerak boʻlgan kattaliklarni<\/b> yozing.<br>\n② <b>Chizma<\/b> chizing: zaryadlar, ishoralar va masofani belgilang.<br>\n③ <b>Kuchlarning yoʻnalishini<\/b> aniqlang: bir xil ishora — itarish, turli ishora — tortishish.<br>\n④ <b>Formulani<\/b> tanlang: <span class=\"f\">F = k·|q₁q₂| / r²<\/span><br>\n⑤ <b>SI birliklariga<\/b> oʻtkazing: μC → C (·10⁻⁶), sm → m (·10⁻²).<br>\n⑥ <b>Hisoblang<\/b> va natijani tekshiring.<\/p><\/div>\n<div class=\"card\"><h3>2. Tipik xatolar<\/h3>\n<p>• Santimetrni metrga aylantirmaslik (r = 20 sm = 0,2 m, lekin 20 m emas).<br>\n• Masofaning <b>kvadratini<\/b> olishni unutish.<br>\n• Ishoralarni eʼtiborsiz qoldirish: kuch <b>moduli<\/b> hisoblanadi, yoʻnalish alohida aniqlanadi.<br>\n• Tegishdan keyin zaryad taqsimotini notoʻgʻri hisoblash.<\/p><\/div>\n<div class=\"card\"><h3>3. Asosiy masala turlari<\/h3>\n<p><b>Kuchni topish:<\/b> F = k·|q₁q₂| / r².<br>\n<b>Masofani topish:<\/b> r = √(k·|q₁q₂| / F).<br>\n<b>Zaryadni topish:<\/b> q₂ = F·r² / (k·q₁).<br>\n<b>Nol kuch nuqtasi:<\/b> zaryadlar bir xil ishorali boʻlsa, nuqta kichik zaryaddan uzoqroqda boʻladi. Agar q₁ va q₂ bir xil ishorali boʻlsa, x = L·√q₁ / (√q₁ + √q₂) (x — q₁ dan masofa, L — zaryadlar orasidagi masofa).<\/p><\/div>\n<div class=\"card\"><h3>4. Tegishda zaryadlar<\/h3>\n<p>Bir xil sharlar tegizilsa, zaryad teng boʻlinadi: <span class=\"f\">q' = (q₁ + q₂) / 2<\/span><\/p><\/div>\n<div class=\"card\"><h3>5. Superpozitsiya masalalari<\/h3>\n<p>Bir zaryadga bir nechta zaryad taʼsir qilsa, kuchlarni <b>x<\/b> va <b>y<\/b> oʻqlari boʻyicha alohida proyeksiyalang, soʻng ularni qoʻshing. Simmetrik joylashuvda baʼzi tashkil etuvchilar bir-birini yoʻqotadi.<\/p><\/div>\n<\/section>\n\n<section id=\"s1\">\n<h2>🧪 1-simulyatsiya: Masala kalkulyatori<\/h2>\n<p class=\"mu\">Rejimni tanlang. Qolgan kattaliklarni sliderlar bilan kiriting, kalkulyator yechim bosqichlarini koʻrsatadi.<\/p>\n<div class=\"row\"><select id=\"mode\">\n<option value=\"F\">Kuchni topish (F)<\/option>\n<option value=\"r\">Masofani topish (r)<\/option>\n<option value=\"q\">Zaryadni topish (q₂)<\/option>\n<\/select><\/div>\n<label>q₁ = <span id=\"vq1\"><\/span> μC<\/label><input type=\"range\" id=\"sq1\" min=\"1\" max=\"10\" step=\"1\" value=\"2\">\n<label>q₂ = <span id=\"vq2\"><\/span> μC<\/label><input type=\"range\" id=\"sq2\" min=\"1\" max=\"10\" step=\"1\" value=\"3\">\n<label>r = <span id=\"vr\"><\/span> sm<\/label><input type=\"range\" id=\"sr\" min=\"5\" max=\"50\" step=\"1\" value=\"20\">\n<label>F = <span id=\"vF\"><\/span> N<\/label><input type=\"range\" id=\"sF\" min=\"0.1\" max=\"10\" step=\"0.1\" value=\"0.9\">\n<div class=\"steps\" id=\"i1\"><\/div>\n<\/section>\n\n<section id=\"s2\">\n<h2>🧪 2-simulyatsiya: Nol kuch nuqtasi<\/h2>\n<p class=\"mu\">Ikki musbat zaryad q₁ (chapda) va q₂ (oʻngda) orasida masofa 40 sm. Sinov zaryadi (+1 μC) ni suring. Grafik sinov zaryadiga taʼsir qiluvchi natijaviy kuchni koʻrsatadi. Kuch nolga teng boʻlgan nuqtani toping.<\/p>\n<label>q₁ = <span id=\"bq1v\"><\/span> μC<\/label><input type=\"range\" id=\"bq1\" min=\"1\" max=\"9\" step=\"1\" value=\"1\">\n<label>q₂ = <span id=\"bq2v\"><\/span> μC<\/label><input type=\"range\" id=\"bq2\" min=\"1\" max=\"9\" step=\"1\" value=\"4\">\n<label>Sinov zaryadi joyi x = <span id=\"bxv\"><\/span> sm<\/label><input type=\"range\" id=\"bx\" min=\"1\" max=\"39\" step=\"1\" value=\"10\">\n<canvas id=\"c2\" width=\"360\" height=\"300\"><\/canvas>\n<div class=\"steps\" id=\"i2\"><\/div>\n<\/section>\n\n<section id=\"s3\">\n<h2>🎮 1-oʻyin: Tezkor hisob<\/h2>\n<p class=\"mu\">60 soniya ichida iloji boricha koʻp masalani toʻgʻri yeching. Birliklarga ehtiyot boʻling!<\/p>\n<div class=\"row\"><button class=\"btn\" id=\"g1s\">Boshlash<\/button><span class=\"out\" id=\"g1t\">60 s<\/span><span class=\"out\" id=\"g1sc\"><\/span><\/div>\n<div class=\"card\">\n<p class=\"out\" id=\"g1q\">Boshlash tugmasini bosing.<\/p>\n<div id=\"g1o\"><\/div>\n<\/div>\n<\/section>\n\n<section id=\"s4\">\n<h2>🎮 2-oʻyin: Xato bosqichni toping<\/h2>\n<p class=\"mu\">Har bir masalaning yechimida bitta xato bosqich bor. Shu bosqichni tanlang. Jami 6 masala.<\/p>\n<div class=\"card\">\n<p class=\"out\" id=\"g2q\"><\/p>\n<div id=\"g2o\"><\/div>\n<p class=\"out\" id=\"g2m\"><\/p>\n<\/div>\n<\/section>\n\n<section id=\"s5\">\n<h2>📝 Test (20 ta masala)<\/h2>\n<div class=\"card\"><div class=\"bar\"><i id=\"pb\"><\/i><\/div><p class=\"mu\" id=\"tn\"><\/p><h3 id=\"tq\"><\/h3><div id=\"to\"><\/div><div class=\"row\"><button class=\"btn\" id=\"tx\" style=\"display:none\">Keyingisi<\/button><\/div><\/div>\n<\/section>\n<\/main>\n\n", "js": "\nconst $=id=>document.getElementById(id);\nconst K=9e9;\nconst col=()=>getComputedStyle(document.body).color;\nconst SUP={\"-\":\"⁻\",\"0\":\"⁰\",\"1\":\"¹\",\"2\":\"²\",\"3\":\"³\",\"4\":\"⁴\",\"5\":\"⁵\",\"6\":\"⁶\",\"7\":\"⁷\",\"8\":\"⁸\",\"9\":\"⁹\"};\nconst sup=n=>String(n).split(\"\").map(c=>SUP[c]).join(\"\");\nconst num=(x,d)=>x.toFixed(d).replace(\".\",\",\");\nfunction fmtF(F){\n  const a=Math.abs(F);\n  if(a===0)return \"0 N\";\n  if(a>=0.01)return num(a,3)+\" N\";\n  const e=Math.floor(Math.log10(a));\n  return num(a/10**e,2)+\"·10\"+(e<0?\"⁻\":\"\")+sup(Math.abs(e))+\" N\";\n}\n// Kulon kuchi (imzoli, N). q1,q2 — μC; r — sm\nfunction coul(q1,q2,r){return K*q1*q2*1e-12/((r/100)**2)}\nfunction pos(c,e){const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*c.width/r.width,y:(p.clientY-r.top)*c.height/r.height}}\n\n/* ---------- Navigatsiya ---------- */\nconst tabs=[\"📖 Nazariya\",\"🧪 Kalkulyator\",\"🧪 Nol kuch nuqtasi\",\"🎮 Tezkor hisob\",\"🎮 Xato bosqich\",\"📝 Test\"];\nfunction show(n){\n  document.querySelectorAll(\"section\").forEach((s,i)=>s.classList.toggle(\"on\",i===n));\n  [...$(\"nav\").children].forEach((b,i)=>b.classList.toggle(\"on\",i===n));\n}\ntabs.forEach((t,i)=>{const b=document.createElement(\"button\");b.textContent=t;b.onclick=()=>show(i);$(\"nav\").appendChild(b)});\n\n/* ---------- 1-simulyatsiya: kalkulyator ---------- */\nfunction drawSim1(){\n  const mode=$(\"mode\").value;\n  const q1=+$(\"sq1\").value,q2s=+$(\"sq2\").value,rs=+$(\"sr\").value,Fs=+$(\"sF\").value;\n  $(\"vq1\").textContent=q1;$(\"vq2\").textContent=q2s;$(\"vr\").textContent=rs;$(\"vF\").textContent=num(Fs,1);\n  $(\"sq2\").disabled=mode===\"q\";$(\"sr\").disabled=mode===\"r\";$(\"sF\").disabled=mode!==\"q\"&&mode!==\"r\";\n  let steps=\"\";\n  if(mode===\"F\"){\n    const F=Math.abs(coul(q1,q2s,rs));\n    const rm=rs/100;\n    steps=`<b>Berilgan:<\/b> q₁ = ${q1} μC, q₂ = ${q2s} μC, r = ${rs} sm<br>\n    <b>SI:<\/b> q₁ = ${q1}·10⁻⁶ C, q₂ = ${q2s}·10⁻⁶ C, r = ${num(rm,2)} m<br>\n    <b>Formula:<\/b> F = k·|q₁q₂| / r²<br>\n    <b>Hisoblash:<\/b> F = 9·10⁹·${q1*q2s}·10⁻¹² / (${num(rm,2)})² = <b>${fmtF(F)}<\/b><br>\n    <b>Javob:<\/b> ${q1*q2s>0?\"itarish\":\"tortishish\"} kuchi, ${fmtF(F)}`;\n  }else if(mode===\"r\"){\n    const rm=Math.sqrt(K*q1*q2s*1e-12/Fs);\n    steps=`<b>Berilgan:<\/b> q₁ = ${q1} μC, q₂ = ${q2s} μC, F = ${num(Fs,1)} N<br>\n    <b>Formula:<\/b> r² = k·|q₁q₂| / F<br>\n    <b>Hisoblash:<\/b> r² = 9·10⁹·${q1*q2s}·10⁻¹² / ${num(Fs,1)} = ${num(rm*rm,4)} m²<br>\n    <b>Javob:<\/b> r = √${num(rm*rm,4)} = <b>${num(rm*100,1)} sm<\/b> (${num(rm,3)} m)`;\n    $(\"vr\").textContent=num(rm*100,1);\n  }else{\n    const q2m=Fs*(rs/100)**2/(K*q1)*1e12;\n    steps=`<b>Berilgan:<\/b> q₁ = ${q1} μC, r = ${rs} sm, F = ${num(Fs,1)} N<br>\n    <b>Formula:<\/b> q₂ = F·r² / (k·q₁)<br>\n    <b>Hisoblash:<\/b> q₂ = ${num(Fs,1)}·(${num(rs/100,2)})² / (9·10⁹·${q1}·10⁻⁶) = ${num(q2m,2)}·10⁻⁶ C<br>\n    <b>Javob:<\/b> q₂ = <b>${num(q2m,2)} μC<\/b>`;\n    $(\"vq2\").textContent=num(q2m,2);\n  }\n  $(\"i1\").innerHTML=steps;\n}\n[\"mode\",\"sq1\",\"sq2\",\"sr\",\"sF\"].forEach(i=>$(i).oninput=drawSim1);\n$(\"mode\").onchange=drawSim1;\n\n/* ---------- 2-simulyatsiya: nol kuch nuqtasi ---------- */\nconst c2=$(\"c2\"),x2=c2.getContext(\"2d\");\nconst L=40; // sm\nfunction drawSim2(){\n  const q1=+$(\"bq1\").value,q2=+$(\"bq2\").value,x=+$(\"bx\").value;\n  $(\"bq1v\").textContent=q1;$(\"bq2v\").textContent=q2;$(\"bxv\").textContent=x;\n  // Sinov zaryadi +1 μC. Chapga qarab musbat — o'ngga\n  const net=(xx)=>coul(q1,1,xx)-coul(q2,1,L-xx);\n  x2.clearRect(0,0,360,300);\n  const c=col();\n  // grafik: 0..140 px oralig'ida\n  const gx0=20,gx1=340,gy0=15,gy1=150,mid=(gy0+gy1)/2;\n  const vals=[];\n  for(let xx=0.5;xx<=39.5;xx+=0.5){vals.push([xx,net(xx)])}\n  const tr=F=>Math.sign(F)*Math.log10(1+Math.abs(F)*1000);\n  const maxV=Math.max(...vals.map(v=>Math.abs(tr(v[1]))),1e-9);\n  x2.strokeStyle=c;x2.lineWidth=1;x2.globalAlpha=0.4;\n  x2.beginPath();x2.moveTo(gx0,mid);x2.lineTo(gx1,mid);x2.stroke();x2.globalAlpha=1;\n  x2.strokeStyle=\"#3b6cf6\";x2.lineWidth=2.5;x2.beginPath();\n  vals.forEach((v,i)=>{\n    const px=gx0+(v[0]/L)*(gx1-gx0),py=mid-tr(v[1])/maxV*((gy1-gy0)/2-4);\n    i===0?x2.moveTo(px,py):x2.lineTo(px,py);\n  });\n  x2.stroke();\n  x2.fillStyle=c;x2.font=\"12px system-ui\";x2.textAlign=\"left\";\n  x2.fillText(\"F(x): + o'ngga, − chapga\",gx0,gy0-2+10);\n  // sinov zaryadi chizig'i\n  const xp=gx0+(x/L)*(gx1-gx0);\n  x2.strokeStyle=\"#f5a524\";x2.lineWidth=1.5;x2.setLineDash([4,3]);\n  x2.beginPath();x2.moveTo(xp,gy0);x2.lineTo(xp,gy1);x2.stroke();x2.setLineDash([]);\n  // qurilma: zaryadlar va sinov zaryadi\n  const yb=225,ax=20,bx=340;\n  x2.strokeStyle=c;x2.lineWidth=1;x2.beginPath();x2.moveTo(ax,yb);x2.lineTo(bx,yb);x2.stroke();\n  const drawQ=(px,q,lab)=>{\n    x2.fillStyle=\"#e5484d\";x2.beginPath();x2.arc(px,yb,13,0,7);x2.fill();\n    x2.fillStyle=\"#fff\";x2.font=\"bold 16px system-ui\";x2.textAlign=\"center\";x2.fillText(\"+\",px,yb+6);\n    x2.fillStyle=c;x2.font=\"12px system-ui\";x2.fillText(lab,px,yb+32);\n  };\n  drawQ(ax,q1,\"q₁ = \"+q1+\" μC\");\n  drawQ(bx,q2,\"q₂ = \"+q2+\" μC\");\n  // sinov zaryadi\n  const F=net(x);\n  x2.fillStyle=\"#f5a524\";x2.beginPath();x2.arc(xp,yb-35,8,0,7);x2.fill();\n  x2.fillStyle=c;x2.font=\"12px system-ui\";x2.textAlign=\"center\";x2.fillText(\"q₀\",xp,yb-48);\n  if(Math.abs(F)>1e-9){\n    const len=Math.min(60,Math.abs(F)*200)*Math.sign(F);\n    x2.strokeStyle=\"#f5a524\";x2.fillStyle=\"#f5a524\";x2.lineWidth=3;\n    x2.beginPath();x2.moveTo(xp,yb-35);x2.lineTo(xp+len,yb-35);x2.stroke();\n  }\n  // yechim\n  const x0=L*Math.sqrt(q1)/(Math.sqrt(q1)+Math.sqrt(q2));\n  $(\"i2\").innerHTML=`<b>Sinov zaryadiga natijaviy kuch:<\/b> ${fmtF(F)} ${F>0?\"(oʻngga)\":F<0?\"(chapga)\":\"\"}<br>\n  <b>Nol kuch nuqtasi (formula):<\/b> x = L·√q₁ / (√q₁ + √q₂) = ${L}·√${q1} / (√${q1} + √${q2}) = <b>${num(x0,1)} sm<\/b><br>\n  <span class=\"mu\">Grafikda F(x) nolga teng boʻlgan nuqta — shu muvozanat nuqtasi. Sinov zaryadini shu joyga qoʻying.<\/span>`;\n}\n[\"bq1\",\"bq2\",\"bx\"].forEach(i=>$(i).oninput=drawSim2);\n\n/* ---------- 1-oʻyin: tezkor hisob ---------- */\nconst c3=null;\nlet G1={t:60,s:0,n:0,timer:null,ans:-1,locked:false,running:false};\nfunction clearG1(){if(G1.timer){clearInterval(G1.timer);G1.timer=null}}\nfunction nextG1(){\n  G1.locked=false;\n  const q1=1+Math.floor(Math.random()*9),q2=1+Math.floor(Math.random()*9),r=10+Math.floor(Math.random()*41);\n  const F=coul(q1,q2,r);\n  const opts=[{v:F,ok:true},{v:F*10,ok:false},{v:F/10,ok:false},{v:F*100,ok:false}].sort(()=>Math.random()-.5);\n  $(\"g1q\").textContent=`q₁ = ${q1} μC, q₂ = ${q2} μC, r = ${r} sm. Kulon kuchi qancha?`;\n  const box=$(\"g1o\");box.innerHTML=\"\";\n  opts.forEach(o=>{\n    const b=document.createElement(\"button\");b.className=\"opt\";b.textContent=fmtF(o.v);\n    b.onclick=()=>{\n      if(G1.locked||!G1.running)return;G1.locked=true;\n      if(o.ok){G1.s++;b.classList.add(\"right\")}else{b.classList.add(\"bad\");\n        [...box.children].forEach((x,i)=>{if(opts[i].ok)x.classList.add(\"right\")})}\n      G1.n++;$(\"g1sc\").textContent=`Ball: ${G1.s}`;\n      setTimeout(()=>{if(G1.running)nextG1()},700);\n    };\n    box.appendChild(b);\n  });\n}\n$(\"g1s\").onclick=()=>{\n  clearG1();\n  G1={t:60,s:0,n:0,timer:nul
